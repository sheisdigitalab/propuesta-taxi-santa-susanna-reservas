  [...bookings].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(b=>{const c=(map[b.phone]=map[b.phone]||{name:b.name,phone:b.phone,lang:b.lang,email:'',marketing:false,list:[]});
    c.list.push(b); c.name=b.name; c.lang=b.lang; if(b.email)c.email=b.email; if(b.marketing!==undefined)c.marketing=!!b.marketing;});
  return Object.values(map).map(c=>{const ok=c.list.filter(b=>b.status!=='cancelada');const dates=ok.map(b=>b.date).sort();
    return {...c,count:ok.length,spent:ok.reduce((s,b)=>s+b.total,0),first:dates[0]||c.list[0].date,last:dates[dates.length-1]||c.list[0].date,

function Stepper({id,value,onChange,min=0,max=8,label}){

function Section({title,icon:Icn,children,aside}){

const inputCls = "h-12 w-full rounded-xl border border-line bg-surface px-3.5 text-[15px] outline-none focus:border-brand";

function Combo({id,value,onChange,options,placeholder,icon:Icn}){
  const [q,setQ]=useState(''); const [open,setOpen]=useState(false); const [hi,setHi]=useState(0); const ref=useRef(null);
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h)},[]);
  const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const list=useMemo(()=>{const nq=norm(q.trim());if(!nq)return options;
    const score=o=>{const l=norm(o.label);if(l.startsWith(nq))return 0;if(l.split(/[^a-z0-9]+/).some(w=>w.startsWith(nq)))return 1;if(l.includes(nq))return 2;if(norm(o.group||'').includes(nq))return 3;return 9};
    return options.map(o=>({o,s:score(o)})).filter(x=>x.s<9).sort((a,b)=>a.s-b.s).map(x=>({...x.o,group:q?(x.s<3?'Coincidencias':'En la misma zona'):x.o.group}))},[q,options]);
  const pick=o=>{onChange(o);setQ('');setOpen(false)};
  let lastGroup=null;
  return <div ref={ref} className="relative">
    <div className="flex h-12 items-center gap-2 rounded-xl border border-line bg-surface px-3.5 focus-within:border-brand">
      <span className="text-muted">{Icn&&<Icn/>}</span>
      <input id={id} role="combobox" aria-expanded={open} aria-controls={id+'-lista'} autoComplete="off"
        className="h-full min-w-0 flex-1 bg-transparent text-[15px] outline-none placeholder:text-muted"
        placeholder={value?value.label:placeholder} value={open?q:(value?value.label:'')}
        onFocus={()=>{setOpen(true);setHi(0)}} onChange={e=>{setQ(e.target.value);setOpen(true);setHi(0)}}
        onKeyDown={e=>{if(e.key==='ArrowDown'){e.preventDefault();setHi(h=>Math.min(h+1,list.length-1))}else if(e.key==='ArrowUp'){e.preventDefault();setHi(h=>Math.max(h-1,0))}else if(e.key==='Enter'&&open&&list[hi]){e.preventDefault();pick(list[hi])}else if(e.key==='Escape'){setOpen(false)}}}/>
      {value&&!open&&<button type="button" aria-label="Borrar" onClick={()=>onChange(null)} className="text-muted hover:text-ink"><I.X/></button>}
    </div>
    {open&&<ul id={id+'-lista'} role="listbox" className="absolute z-30 mt-1 max-h-72 w-full overflow-auto rounded-xl border border-line bg-surface py-1 shadow-xl">
      {list.length===0&&<li className="px-4 py-3 text-muted">No encontramos ese lugar. Escríbelo en comentarios o pregúntanos por WhatsApp.</li>}
      {list.map((o,i)=>{const head=o.group!==lastGroup;lastGroup=o.group;return <React.Fragment key={o.key}>
        {head&&<li className="px-4 pb-1 pt-2 text-[12px] font-bold uppercase tracking-wider text-muted" role="presentation">{o.group}</li>}
        <li role="option" aria-selected={i===hi} onMouseEnter={()=>setHi(i)} onMouseDown={e=>{e.preventDefault();pick(o)}}
          className={`flex cursor-pointer items-center justify-between gap-3 px-4 py-2.5 ${i===hi?'bg-sunken':''}`}>
          <span className="min-w-0 truncate">{o.label}</span>{o.right&&<span className="shrink-0 text-[13px] font-semibold text-muted tnum">{o.right}</span>}
        </li></React.Fragment>})}
    </ul>}
  </div>;
}

  const dir = f.from&&f.from.type==='ss'?'out':'in';

function WaPreview({b}){
  const d=DRIVERS.find(x=>x.id===b.driverId);
  const msgs=[{t:'Reserva recibida',x:`${dayLabel(b.date)} a las ${b.time} · ${tripName(b)} · ${eur(b.total)} · Código ${b.id}. Te confirmamos en breve.`}];
  if(['asignada','en_camino','completada'].includes(b.status)) msgs.push({t:'Reserva confirmada',x:`Te recogemos ${dayLabel(b.date).toLowerCase()} a las ${b.time}. Tu taxi: ${d?d.car+' · '+d.plate:'Taxi Santa Susanna'}.`});
  if(b.status==='en_camino') msgs.push({t:'Tu taxi está en camino',x:'Llega en unos minutos a la recogida.'});
  return <div className="rounded-2xl bg-[#EFE7DD] p-3 dark:bg-sunken" aria-label="Mensajes de WhatsApp al cliente">
    <div className="mb-2 text-[12px] font-bold uppercase tracking-wider text-[#4B5A51] dark:text-muted">WhatsApp del cliente</div>
    <div className="flex flex-col gap-2">{msgs.map((m,i)=><div key={i} className="max-w-[92%] rounded-xl border-l-4 border-brand bg-white px-3 py-2 text-[14px] text-[#16221B] shadow-sm dark:bg-surface dark:text-ink">
      <div className="font-bold text-[#00854A] dark:text-brandink">{m.t}</div>{m.x}</div>)}</div>
  </div>;
}

/* ---------- Panel de hoy ---------- */
function TrendChart({bookings}){
  const days=Array.from({length:14},(_,i)=>addDays(i-13));
  const data=days.map(d=>{const l=bookings.filter(b=>b.date===d&&b.status!=='cancelada');return {d,n:l.length,eur:l.reduce((s,b)=>s+b.total,0)}});
  const max=Math.max(1,...data.map(x=>x.n));
  const thisW=data.slice(7).reduce((s,x)=>s+x.n,0), lastW=data.slice(0,7).reduce((s,x)=>s+x.n,0);
  const diff=lastW?Math.round((thisW-lastW)/lastW*100):0;
  const [hover,setHover]=useState(null); const h=hover!==null?data[hover]:null;
  return <div className="rounded-2xl border border-line bg-surface p-4">
    <div className="mb-4 flex flex-wrap items-end justify-between gap-3">
      <div><h3 className="font-bold">Reservas de los últimos 14 días</h3>
        <p className="text-[13px] text-muted">{h?`${new Date(h.d+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}: ${h.n} reserva${h.n===1?'':'s'} · ${eur(h.eur)}`:'Pasa por encima de una barra para ver el detalle'}</p></div>
      <div className="text-right"><div className="text-[13px] text-muted">Últimos 7 días</div><div className="text-[20px] font-extrabold tnum">{thisW} <span className={`text-[13px] font-bold ${diff>=0?'text-ok':'text-bad'}`}>{diff>=0?'+':''}{diff} % vs. semana anterior</span></div></div>
    </div>
    <div className="flex h-32 items-end gap-1.5" role="img" aria-label={`Tendencia: ${data.map(x=>x.n).join(', ')} reservas por día`}>
      {data.map((x,i)=><button key={x.d} type="button" onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} onFocus={()=>setHover(i)} onBlur={()=>setHover(null)}
        aria-label={`${dayLabel(x.d)}: ${x.n} reservas`} className="group flex h-full min-w-0 flex-1 flex-col justify-end">
        <span className={`block w-full rounded-t-md transition ${x.d===TODAY?'bg-gold':i>=7?'bg-brand':'bg-line'} ${hover===i?'opacity-80':''}`} style={{height:`${Math.max(4,x.n/max*100)}%`}}></span></button>)}
    </div>
    <div className="mt-1.5 flex gap-1.5 text-[12px] text-muted tnum">{data.map(x=><span key={x.d} className="min-w-0 flex-1 text-center">{x.d===TODAY?'Hoy':new Date(x.d+'T12:00').getDate()}</span>)}</div>
  </div>;
}
function Today({bookings,open,assign,settings}){
  const today=bookings.filter(b=>b.date===TODAY&&b.status!=='cancelada').sort((a,b)=>a.time.localeCompare(b.time));
  const pending=bookings.filter(b=>b.status==='nueva'&&b.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const income=today.reduce((s,b)=>s+b.total,0);
  const toCollect=today.filter(b=>!b.paid).reduce((s,b)=>s+b.total,0);
  const now=nowHM();
  const alerts=today.filter(b=>b.status!=='completada'&&(b.status==='nueva'||b.flightNote)).map(b=>({b,
    text:[b.status==='nueva'?(b.time<now?`Sin confirmar y la recogida era a las ${b.time}`:`Sin confirmar · recogida a las ${b.time} (${untilLabel(b.time)})`):null,b.flightNote].filter(Boolean).join(' · '),
    tone:b.status==='nueva'?'warn':'info'}));
  const nextB=today.find(b=>b.time>=now&&b.status!=='completada');
  const clashes=today.filter(b=>b.status!=='completada').map(b=>({b,c:conflictsOf(b,today,settings)})).filter(x=>x.c.length&&x.c.every(c=>c.time>=x.b.time));
  clashes.forEach(({b,c})=>alerts.unshift({b,text:`Se solapa con la recogida de las ${c.map(x=>x.time).join(' y ')}: el taxi no llega a las dos`,tone:'bad'}));
  const busy=today.reduce((s,b)=>s+busyMin(b.dest,settings),0); const hours=settings.workHours||14; const occ=Math.min(100,Math.round(busy/(hours*60)*100));
  const tiles=[{k:'Viajes hoy',v:today.length,s:`${today.filter(b=>b.status==='completada').length} completados`},{k:'Por confirmar',v:pending.length,s:'de hoy en adelante',tone:pending.length?'text-warn':''},
    {k:'Facturación de hoy',v:eur(income),s:`${eur(toCollect)} a cobrar en el coche`},{k:'Taxi ocupado hoy',v:`${occ} %`,s:`${hrs(busy)} h de ${hours} h de trabajo`,bar:occ}];
  return <div className="flex flex-col gap-5">
    <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">{tiles.map(t=><div key={t.k} className="min-w-0 rounded-2xl border border-line bg-surface p-4">
      <div className="text-[13px] font-semibold text-muted">{t.k}</div><div className={`mt-1 text-[26px] font-extrabold tnum ${t.tone||''}`}>{t.v}</div><div className="text-[13px] text-muted">{t.s}</div>
      {t.bar!==undefined&&<div className="mt-2 h-2 overflow-hidden rounded-full bg-sunken" role="img" aria-label={`Ocupación ${t.bar} %`}><div className="h-full rounded-full bg-brand" style={{width:t.bar+'%'}}></div></div>}</div>)}</div>
    <TrendChart bookings={bookings}/>
    {alerts.length>0&&<div className="flex flex-col gap-2">{alerts.map((a,i)=><button key={i} onClick={()=>open(a.b.id)} className={`flex items-center gap-3 rounded-xl p-3.5 text-left text-[14px] ${a.tone==='bad'?'bg-badsoft text-bad':a.tone==='warn'?'bg-warnsoft text-warn':'bg-infosoft text-info'}`}>
      <span className="shrink-0">{a.tone==='info'?<I.Plane/>:<I.Alert/>}</span><span className="min-w-0 flex-1"><b>{a.text}</b><span className="block truncate opacity-90">{a.b.name} · {tripName(a.b)}</span></span><I.Chev/></button>)}</div>}
    <div className="grid gap-5 lg:grid-cols-[1.4fr_1fr]">
      <div className="min-w-0 rounded-2xl border border-line bg-surface">
        <div className="flex items-center justify-between border-b border-line p-4"><h3 className="font-bold">Recogidas de hoy</h3><span className="text-[13px] text-muted">{dayLabel(TODAY)}</span></div>

function AssignBar({b,assign,bookings,settings}){

/* ---------- Reservas: lista + ficha ---------- */
function QuickAction({b,bookings,update,assign,small}){
  const cls=`shrink-0 rounded-full font-semibold whitespace-nowrap ${small?'px-3 py-1.5 text-[13px]':'h-9 px-3 text-[13px]'}`;
  const stop=fn=>e=>{e.stopPropagation();fn()};
  if(b.status==='nueva') return <button onClick={stop(()=>assign(b.id,'d1'))} className={`${cls} bg-brandstrong text-white`}>Confirmar</button>;
  if(b.status==='asignada') return <button onClick={stop(()=>update(b.id,{status:'en_camino'},'Marcada en camino'))} className={`${cls} border border-line bg-surface hover:border-brand`}>En camino</button>;
  if(b.status==='en_camino') return <button onClick={stop(()=>update(b.id,{status:'completada'},'Marcada completada'))} className={`${cls} border border-line bg-surface hover:border-brand`}>Completar</button>;
  return null;
}

/* ---------- Agenda del coche ---------- */
function Agenda({bookings,open,assign,settings}){
  const [day,setDay]=useState(TODAY);
  const days=[TODAY,addDays(1),addDays(2),addDays(3)];
  const list=bookings.filter(b=>b.date===day&&b.status!=='cancelada').sort((a,b)=>a.time.localeCompare(b.time));
  const startH=6,endH=24,pxMin=1.1;
  const rows=[]; let cursor=startH*60;
  list.forEach(b=>{const a=toMin(b.time),e=a+busyMin(b.dest,settings); if(a-cursor>=30) rows.push({free:true,from:cursor,to:a}); rows.push({b,from:a,to:e,clash:conflictsOf(b,list,settings).length>0}); cursor=Math.max(cursor,e);});
  if(endH*60-cursor>=30) rows.push({free:true,from:cursor,to:endH*60});
  const busy=list.reduce((s,b)=>s+busyMin(b.dest,settings),0);
  return <div className="flex flex-col gap-4">
    <div className="flex flex-wrap gap-2">{days.map(d=>{const n=bookings.filter(b=>b.date===d&&b.status!=='cancelada').length;return <button key={d} onClick={()=>setDay(d)} className={`rounded-full px-4 py-2 text-[14px] font-semibold ${day===d?'bg-deep text-white':'bg-surface border border-line'}`}>{dayLabel(d)} <span className="opacity-70 tnum">· {n}</span></button>})}</div>
    <div className="grid gap-3 sm:grid-cols-3">
      {[['Viajes',list.length],['Horas ocupadas',`${hrs(busy)} h`],['Por confirmar',list.filter(b=>b.status==='nueva').length]].map(([k,v])=><div key={k} className="rounded-2xl border border-line bg-surface p-4"><div className="text-[13px] font-semibold text-muted">{k}</div><div className="mt-1 text-[24px] font-extrabold tnum">{v}</div></div>)}
    </div>
    <div className="rounded-2xl border border-line bg-surface p-4">
      <h3 className="mb-1 font-bold">El día del taxi</h3>
      <p className="mb-4 text-[13px] text-muted">Cada viaje ocupa el coche el tiempo de ida y vuelta. Los huecos libres son las horas que aún puedes vender.</p>
      <ol className="flex flex-col gap-2">{rows.map((r,i)=>r.free
        ?<li key={'f'+i} className="flex items-center gap-3 rounded-xl border border-dashed border-line px-3 py-2 text-[14px] text-muted"><span className="w-28 shrink-0 tnum">{toHM(r.from)} – {r.to>=24*60?'24:00':toHM(r.to)}</span><span>Libre · {hrs(r.to-r.from)} h</span></li>
        :<li key={r.b.id}><button onClick={()=>open(r.b.id)} className={`flex w-full items-center gap-3 rounded-xl border-l-4 px-3 py-3 text-left ${r.clash?'border-bad bg-badsoft':r.b.status==='nueva'?'border-warn bg-warnsoft':'border-brand bg-brandsoft'}`} style={{minHeight:Math.max(56,(r.to-r.from)*pxMin*0.5)}}>
          <span className="w-28 shrink-0 font-bold tnum">{r.b.time} – {toHM(r.to)}</span>
          <span className="min-w-0 flex-1"><span className="block truncate font-semibold text-ink">{tripName(r.b)}</span><span className="block truncate text-[13px] text-muted">{r.b.name} · {r.b.pax} pax · {eur(r.b.total)}{r.clash?' · se solapa con otro viaje':''}</span></span>
          <Chip status={r.b.status}/></button>
          {r.b.status==='nueva'&&<div className="mt-1.5 pl-1"><AssignBar b={r.b} assign={assign} bookings={bookings} settings={settings}/></div>}</li>)}</ol>
      {list.length===0&&<p className="mt-2 text-muted">No hay viajes este día: el taxi está libre.</p>}
    </div>
  </div>;
}

/* ---------- Clientes ---------- */
function Clients({bookings,open}){
  const [q,setQ]=useState('');
  const [only,setOnly]=useState('todos');
  const all=clientsOf(bookings);
  const rows=all.filter(c=>only==='todos'||(only==='ofertas'?c.marketing:c.count>1)).filter(c=>!q||(c.name+c.phone).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.count-a.count||b.spent-a.spent);
  return <div className="flex flex-col gap-4">
    <div className="flex h-11 items-center gap-2 rounded-xl border border-line bg-surface px-3"><I.Search className="text-muted"/><input id="c-buscar" aria-label="Buscar clientes" value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por nombre o teléfono" className="h-full min-w-0 flex-1 bg-transparent outline-none placeholder:text-muted"/></div>
    <div className="flex flex-wrap gap-2">{[['todos',`Todos (${all.length})`],['habituales',`Repiten (${all.filter(c=>c.count>1).length})`],['ofertas',`Aceptan ofertas (${all.filter(c=>c.marketing).length})`]].map(([k,l])=>
      <button key={k} onClick={()=>setOnly(k)} className={`rounded-full px-3 py-1.5 text-[14px] font-semibold ${only===k?'bg-deep text-white':'bg-surface border border-line'}`}>{l}</button>)}</div>
    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">{rows.map(c=><button key={c.phone} onClick={()=>open(c.list[c.list.length-1].id)} className="min-w-0 rounded-2xl border border-line bg-surface p-4 text-left hover:border-brand">
      <div className="flex items-center justify-between gap-2"><span className="truncate font-bold">{c.name}</span><span className="rounded-full bg-sunken px-2 py-0.5 text-[12px] font-bold">{c.lang}</span></div>
      <div className="text-[13px] text-muted tnum">{c.phone}</div>
      <div className="mt-3 flex gap-4 text-[14px]"><span><b className="tnum">{c.count}</b> viajes</span><span><b className="tnum">{eur(c.spent)}</b></span><span className="text-muted">último {dayLabel(c.last).toLowerCase()}</span></div>
      <div className="mt-2 flex flex-wrap gap-1.5">
        {c.count>1&&<span className="rounded-full bg-goldsoft px-2.5 py-0.5 text-[12px] font-bold text-goldink">Cliente habitual</span>}
        <span className={`rounded-full px-2.5 py-0.5 text-[12px] font-bold ${c.marketing?'bg-oksoft text-ok':'bg-sunken text-muted'}`}>{c.marketing?'Acepta ofertas':'Sin permiso de ofertas'}</span>
        {c.email&&<span className="rounded-full bg-sunken px-2.5 py-0.5 text-[12px] font-bold text-muted">Email</span>}
      </div>
    </button>)}</div>
  </div>;
}

/* ---------- Campañas ---------- */
const LANG_NAME={ES:'Español',CA:'Català',EN:'English',DE:'Deutsch',FR:'Français',IT:'Italiano',PT:'Português'};
const SEGMENTS=[
  {id:'todos',name:'Todos los clientes',hint:'Todos los que han reservado alguna vez',test:()=>true},
  {id:'temporada',name:'Temporada pasada',hint:'Viajaron hace entre 10 y 14 meses y no han vuelto',test:c=>c.daysSince>=300&&c.daysSince<=430},
  {id:'repiten',name:'Clientes que repiten',hint:'Dos viajes o más',test:c=>c.count>=2},
  {id:'unviaje',name:'Solo un viaje',hint:'Para animarles a repetir',test:c=>c.count===1},
  {id:'aeropuerto',name:'Traslados al aeropuerto',hint:'Han ido o venido del aeropuerto',test:c=>c.airport},
  {id:'idioma',name:'Por idioma',hint:'Elige el idioma',test:(c,lang)=>c.lang===lang},
];
const TEMPLATES=[
  {id:'vuelve',name:'Vuelve este verano',subject:'¿Vuelves a Santa Susanna este verano?',body:'Hola {nombre}, el año pasado te llevamos en tu viaje y nos encantaría volver a hacerlo. Reserva tu traslado del aeropuerto con precio fijo y un 10 % de descuento con el código VERANO10.'},
  {id:'repite',name:'Gracias por repetir',subject:'Gracias por confiar otra vez en nosotros',body:'Hola {nombre}, gracias por viajar de nuevo con Taxi Santa Susanna. En tu próxima reserva tienes un 10 % de descuento con el código GRACIAS10.'},
  {id:'resena',name:'Pedir reseña',subject:'¿Qué tal tu viaje con nosotros?',body:'Hola {nombre}, gracias por viajar con Taxi Santa Susanna. Si te ha gustado, nos ayudas mucho dejando tu opinión en Google: solo es un minuto.'},
];
const AUTOS=[
  {id:'resena',name:'Pedir reseña en Google',when:'Al día siguiente de cada viaje completado',channel:'WhatsApp',service:true},
  {id:'vuelve',name:'«Te esperamos este verano»',when:'11 meses después de su último viaje',channel:'Email'},
  {id:'repite',name:'Descuento al que repite',when:'Después de su segundo viaje',channel:'Email'},
];

function Campaigns({bookings,settings,setSettings,campaigns,setCampaigns,toast}){
  const clients=useMemo(()=>clientsOf(bookings),[bookings]);
  const [seg,setSeg]=useState('temporada'); const [lang,setLang]=useState('EN');
  const [channel,setChannel]=useState('email'); const [tpl,setTpl]=useState(TEMPLATES[0]);
  const [subject,setSubject]=useState(TEMPLATES[0].subject); const [body,setBody]=useState(TEMPLATES[0].body);
  const [confirm,setConfirm]=useState(false); const [showList,setShowList]=useState(false);
  const segDef=SEGMENTS.find(s=>s.id===seg);
  const inSeg=clients.filter(c=>segDef.test(c,lang));
  const consent=inSeg.filter(c=>c.marketing);
  const reachable=consent.filter(c=>channel==='email'?!!c.email:true);
  const noEmail=channel==='email'?consent.length-reachable.length:0;
  const cost=channel==='whatsapp'?reachable.length*0.05:0;
  const sample=reachable[0]||{name:'Laura Martín',lang:'ES'};
  const fill=s=>s.replace(/\{nombre\}/g,sample.name.split(' ')[0]);
  const auto=settings.automations||DEFAULT_AUTOMATIONS;
  const autoCount={
    resena:bookings.filter(b=>b.status==='completada'&&(b.date===TODAY||b.date===addDays(-1))).length,
    vuelve:clients.filter(c=>c.marketing&&c.email&&c.daysSince>=330&&c.daysSince<=360).length,
    repite:clients.filter(c=>c.marketing&&c.email&&c.count===2).length,
  };
  const withOk=clients.filter(c=>c.marketing).length;
  const kpis=[
    {k:'Clientes',v:clients.length,s:'con al menos una reserva'},
    {k:'Aceptan ofertas',v:withOk,s:`${Math.round(withOk/Math.max(1,clients.length)*100)} % del total`},
    {k:'Repiten',v:clients.filter(c=>c.count>1).length,s:'dos viajes o más'},
    {k:'Con email',v:clients.filter(c=>c.email).length,s:'para campañas por email'},
  ];
  const langs=Object.entries(clients.reduce((m,c)=>{m[c.lang]=(m[c.lang]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]);
  const pickTpl=t=>{setTpl(t);setSubject(t.subject);setBody(t.body)};
  function send(){
    const c={id:'c'+Date.now(),at:new Date().toISOString(),name:(channel==='email'?subject:tpl.name)||tpl.name,segment:segDef.id==='idioma'?`Idioma: ${LANG_NAME[lang]||lang}`:segDef.name,channel,sent:reachable.length,result:'Resultados en 48 h'};
    setCampaigns(cs=>[c,...cs]); setConfirm(false); toast(`Campaña enviada a ${reachable.length} personas (simulación)`);
  }
  return <div className="flex flex-col gap-5">
    <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">{kpis.map(t=><div key={t.k} className="min-w-0 rounded-2xl border border-line bg-surface p-4">
      <div className="text-[13px] font-semibold text-muted">{t.k}</div><div className="mt-1 text-[26px] font-extrabold tnum">{t.v}</div><div className="text-[13px] text-muted">{t.s}</div></div>)}</div>

    <div className="flex items-start gap-3 rounded-xl bg-infosoft p-3.5 text-[14px] text-info"><I.Info className="mt-0.5 shrink-0"/>
      <span>Solo reciben campañas los clientes que marcaron la casilla de ofertas al reservar (RGPD). Los avisos del servicio, como la confirmación o el aviso de llegada, se envían siempre.</span></div>

    <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)]">
      <Section title="1. A quién" icon={I.Users}>
        <div className="flex flex-col gap-2" role="radiogroup" aria-label="Grupo de clientes">
          {SEGMENTS.map(s=>{const n=clients.filter(c=>s.test(c,lang));const ok=n.filter(c=>c.marketing).length;const on=seg===s.id;
            return <label key={s.id} htmlFor={'seg-'+s.id} className={`flex cursor-pointer items-center gap-3 rounded-xl border p-3 ${on?'border-brand bg-brandsoft':'border-line hover:border-brand'}`}>
              <input id={'seg-'+s.id} type="radio" name="segmento" className="h-4 w-4 accent-[var(--brand-strong)]" checked={on} onChange={()=>{setSeg(s.id);setConfirm(false)}}/>
              <span className="min-w-0 flex-1"><span className="block font-semibold">{s.name}</span><span className="block text-[13px] text-muted">{s.hint}</span>
                {s.id==='idioma'&&on&&<select id="seg-lang" aria-label="Idioma" value={lang} onChange={e=>setLang(e.target.value)} className="mt-2 h-9 rounded-full border border-line bg-surface px-3 text-[14px] font-semibold">
                  {langs.map(([k,n])=><option key={k} value={k}>{LANG_NAME[k]||k} ({n})</option>)}</select>}</span>
              <span className="shrink-0 text-right"><span className="block text-[18px] font-extrabold tnum">{ok}</span><span className="block text-[12px] text-muted tnum">de {n.length}</span></span>
            </label>})}
        </div>
        <p className="mt-3 text-[13px] text-muted">El número grande son los que aceptan ofertas; el pequeño, todos los del grupo.</p>
      </Section>

      <Section title="2. Qué les dices" icon={I.Mail}>
        <div className="grid gap-3">
          <div className="flex flex-wrap gap-2" role="group" aria-label="Canal">
            {[['email','Email',I.Mail],['whatsapp','WhatsApp',I.Msg]].map(([k,l,C])=><button key={k} type="button" aria-pressed={channel===k} onClick={()=>{setChannel(k);setConfirm(false)}}
              className={`flex h-10 items-center gap-2 rounded-full px-4 text-[14px] font-semibold ${channel===k?'bg-deep text-white':'border border-line bg-surface'}`}><C size={16}/>{l}</button>)}
          </div>
          <div className="flex flex-wrap items-center gap-2"><span className="text-[13px] font-semibold text-muted">Plantillas:</span>
            {TEMPLATES.map(t=><button key={t.id} type="button" onClick={()=>pickTpl(t)} className={`rounded-full border px-3 py-1.5 text-[13px] font-semibold ${tpl.id===t.id?'border-brand bg-brandsoft text-brandink':'border-line hover:border-brand'}`}>{t.name}</button>)}</div>
          {channel==='email'&&<Field label="Asunto" htmlFor="cp-asunto"><input id="cp-asunto" value={subject} onChange={e=>setSubject(e.target.value)} className={inputCls}/></Field>}
          <Field label="Mensaje" htmlFor="cp-texto" hint="{nombre} se cambia por el nombre de cada cliente"><textarea id="cp-texto" rows={5} value={body} onChange={e=>setBody(e.target.value)} className="w-full rounded-xl border border-line bg-surface p-3.5 text-[15px] outline-none focus:border-brand"/></Field>

          <div>
            <div className="mb-1.5 text-[13px] font-semibold uppercase tracking-wide text-muted">Vista previa · {sample.name}</div>
            {channel==='email'?<div className="overflow-hidden rounded-xl border border-line bg-surface">
              <div className="border-b border-line bg-sunken px-4 py-2.5 text-[13px]"><span className="text-muted">De:</span> Taxi Santa Susanna · <span className="text-muted">Asunto:</span> <b>{fill(subject)}</b></div>
              <div className="p-4 text-[14px] leading-relaxed">{fill(body)}<div className="mt-4"><span className="inline-block rounded-full bg-[#007A41] px-4 py-2 text-[14px] font-bold text-white">Reservar mi traslado</span></div>
                <p className="mt-4 text-[13px] text-muted">Recibes este email porque aceptaste recibir ofertas. Darse de baja.</p></div></div>
            :<div className="rounded-xl bg-[#EFE7DD] p-3 dark:bg-sunken"><div className="max-w-[92%] rounded-xl border-l-4 border-brand bg-white px-3 py-2 text-[14px] text-[#16221B] shadow-sm dark:bg-surface dark:text-ink">{fill(body)}
              <div className="mt-1 text-[13px] text-[#4B5A51] dark:text-muted">Responde BAJA para no recibir más ofertas.</div></div></div>}
            {sample.lang&&sample.lang!=='ES'&&<p className="mt-2 text-[13px] text-muted">En la versión real, cada cliente lo recibiría traducido a su idioma.</p>}
          </div>
        </div>
      </Section>
    </div>

    <div className="flex flex-col gap-3 rounded-2xl border-2 border-brand bg-surface p-4 sm:flex-row sm:items-center">
      <div className="min-w-0 flex-1">
        <div className="text-[13px] font-semibold uppercase tracking-wide text-muted">3. Enviar</div>
        <div className="text-[18px] font-extrabold"><span className="tnum">{reachable.length}</span> persona{reachable.length===1?'':'s'} recibirán este {channel==='email'?'email':'WhatsApp'}</div>
        <div className="text-[13px] text-muted">{inSeg.length-consent.length>0&&`${inSeg.length-consent.length} del grupo no aceptan ofertas y se quedan fuera. `}{noEmail>0&&`${noEmail} no tienen email. `}
          {channel==='whatsapp'?`Coste aproximado de Meta: ${new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(cost)}.`:'El email no tiene coste por envío.'}</div>
        <button type="button" onClick={()=>setShowList(v=>!v)} aria-expanded={showList} className="mt-1 text-[13px] font-semibold text-brandink underline underline-offset-2">{showList?'Ocultar destinatarios':'Ver destinatarios'}</button>
      </div>
      {!confirm?<button type="button" disabled={!reachable.length||!body.trim()} onClick={()=>setConfirm(true)} className="h-12 shrink-0 rounded-full bg-brandstrong px-6 font-bold text-white disabled:opacity-40">Enviar campaña</button>
        :<div className="flex shrink-0 flex-wrap items-center gap-2 rounded-xl bg-sunken p-2"><span className="px-1 text-[14px] font-semibold">¿Enviar a {reachable.length}?</span>
          <button type="button" onClick={send} className="h-10 rounded-full bg-brandstrong px-4 font-bold text-white">Sí, enviar</button><button type="button" onClick={()=>setConfirm(false)} className="h-10 rounded-full px-3 font-semibold">No</button></div>}
    </div>
    {showList&&<div className="overflow-hidden rounded-2xl border border-line bg-surface"><ul className="max-h-72 divide-y divide-line overflow-auto">{reachable.map(c=>
      <li key={c.phone} className="flex flex-wrap items-center gap-x-4 gap-y-0.5 px-4 py-2.5 text-[14px]"><span className="min-w-0 flex-1 font-semibold">{c.name}</span><span className="text-muted">{channel==='email'?c.email:c.phone}</span><span className="text-muted">{c.lang} · {c.count} viaje{c.count>1?'s':''}</span></li>)}
      {reachable.length===0&&<li className="p-4 text-center text-muted">Nadie en este grupo acepta ofertas{channel==='email'?' y tiene email':''}.</li>}</ul></div>}

    <div className="grid gap-5 xl:grid-cols-2">
      <Section title="Mensajes automáticos" icon={I.Timer}>
        <div className="flex flex-col divide-y divide-line">{AUTOS.map(a=><label key={a.id} htmlFor={'auto-'+a.id} className="flex cursor-pointer items-center gap-3 py-3">
          <span className="min-w-0 flex-1"><span className="block font-semibold">{a.name}</span><span className="block text-[13px] text-muted">{a.when} · {a.channel}{a.service?' · a todos los clientes':' · solo con permiso'}</span>
            {auto[a.id]&&<span className="mt-0.5 block text-[13px] font-semibold text-brandink tnum">{autoCount[a.id]} programado{autoCount[a.id]===1?'':'s'} ahora mismo</span>}</span>
          <input id={'auto-'+a.id} type="checkbox" className="peer sr-only" checked={!!auto[a.id]} onChange={e=>setSettings(s=>({...s,automations:{...(s.automations||DEFAULT_AUTOMATIONS),[a.id]:e.target.checked}}))}/>
          <span className="relative h-7 w-12 shrink-0 rounded-full bg-line transition peer-checked:bg-brandstrong after:absolute after:left-1 after:top-1 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition peer-checked:after:translate-x-5" aria-hidden="true"></span>
        </label>)}</div>
      </Section>
      <Section title="Campañas enviadas" icon={I.List}>
        {campaigns.length===0?<p className="text-muted">Todavía no has enviado ninguna campaña.</p>:
        <ul className="flex flex-col divide-y divide-line">{campaigns.map(c=><li key={c.id} className="flex items-start gap-3 py-3">
          <span className="mt-0.5 text-brandink">{c.channel==='email'?<I.Mail/>:<I.Msg/>}</span>
          <span className="min-w-0 flex-1"><span className="block font-semibold">{c.name}</span>
            <span className="block text-[13px] text-muted">{new Date(c.at).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})} · {c.segment} · <span className="tnum">{c.sent}</span> enviados</span></span>
          <span className="shrink-0 text-right text-[13px]"><span className="block font-semibold">{c.result}</span>{c.example&&<span className="block text-muted">ejemplo</span>}</span></li>)}</ul>}
      </Section>
    </div>
  </div>;
}

/* ---------- Tarifas y extras ---------- */
function Settings({settings,setSettings,onReset}){
  const [q,setQ]=useState(''); const [confirm,setConfirm]=useState(false);
  const up=(k,v)=>setSettings(s=>({...s,[k]:v}));
  const upT=(id,k,v)=>setSettings(s=>({...s,tarifas:s.tarifas.map(t=>t.id===id?{...t,[k]:Math.max(0,+v||0)}:t)}));
  const upE=(id,k,v)=>setSettings(s=>({...s,extras:s.extras.map(e=>e.id===id?{...e,[k]:Math.max(0,+v||0)}:e)}));
  const tar=settings.tarifas.filter(t=>!q||t.name.toLowerCase().includes(q.toLowerCase()));
  const num="h-10 w-20 rounded-lg border border-line bg-surface px-2 text-right tnum outline-none focus:border-brand";
  return <div className="grid gap-5 xl:grid-cols-[1fr_1.2fr]">
    <div className="flex min-w-0 flex-col gap-5">
      <Section title="Horario y cobro" icon={I.Moon}>
        <div className="grid gap-3 sm:grid-cols-2">
          <Field label="Tarifa de noche desde" htmlFor="s-noche-d"><input id="s-noche-d" type="time" value={settings.nightFrom} onChange={e=>up('nightFrom',e.target.value)} className={inputCls}/></Field>
          <Field label="Hasta" htmlFor="s-noche-h"><input id="s-noche-h" type="time" value={settings.nightTo} onChange={e=>up('nightTo',e.target.value)} className={inputCls}/></Field>
          <Field label="Plazas del taxi" htmlFor="s-plazas" hint="Las bolsas de golf cuentan como plaza"><input id="s-plazas" type="number" min="1" max="8" value={settings.seats||4} onChange={e=>up('seats',Math.max(1,Math.min(8,+e.target.value||1)))} className={inputCls}/></Field>
          <Field label="Horas de trabajo al día" htmlFor="s-horas" hint="Para calcular cuánto está ocupado el taxi"><input id="s-horas" type="number" min="1" max="24" value={settings.workHours||14} onChange={e=>up('workHours',Math.max(1,Math.min(24,+e.target.value||1)))} className={inputCls}/></Field>
          <label htmlFor="s-pagoc" className="flex items-center gap-3 self-end rounded-xl bg-sunken p-3.5 font-semibold"><input id="s-pagoc" type="checkbox" checked={settings.payDriver} onChange={e=>up('payDriver',e.target.checked)} className="h-5 w-5 accent-[var(--brand-strong)]"/>Permitir pago en el coche</label>
        </div>
        <p className="mt-3 text-[13px] text-muted">El horario nocturno, las plazas y las horas de trabajo son valores de ejemplo: ajústalos a tu taxi.</p>
      </Section>
      <Section title="Extras" icon={I.Lug} aside={<span className="text-[13px] text-muted">Precio con IVA</span>}>
        <div className="divide-y divide-line">{settings.extras.map(e=><div key={e.id} className="flex items-center justify-between gap-3 py-2.5">
          <div className="min-w-0"><div className="font-semibold">{e.name}</div><div className="truncate text-[13px] text-muted">{e.hint}</div></div>
          <div className="flex shrink-0 items-center gap-2 text-[13px] text-muted"><label htmlFor={'s-ex-p-'+e.id}>€</label><input id={'s-ex-p-'+e.id} type="number" min="0" value={e.price} onChange={ev=>upE(e.id,'price',ev.target.value)} className={num}/>
            <label htmlFor={'s-ex-m-'+e.id}>máx.</label><input id={'s-ex-m-'+e.id} type="number" min="1" value={e.max} onChange={ev=>upE(e.id,'max',ev.target.value)} className="h-10 w-14 rounded-lg border border-line bg-surface px-2 text-right tnum outline-none focus:border-brand"/></div>
        </div>)}</div>
      </Section>
      <Section title="Datos de ejemplo" icon={I.Reset}>
        <p className="text-[14px] text-muted">Las reservas, los clientes y el coche de esta demostración son ficticios. Los cambios se guardan solo en este navegador.</p>
        {!confirm?<button onClick={()=>setConfirm(true)} className="mt-3 h-11 rounded-full border border-line px-5 font-semibold">Restablecer datos de ejemplo</button>:
          <div className="mt-3 flex flex-wrap items-center gap-2"><span className="font-semibold">Se perderán las reservas y cambios que hayas hecho.</span>
            <button onClick={()=>{onReset();setConfirm(false)}} className="h-10 rounded-full bg-bad px-4 font-bold text-white dark:text-[#1a0b0a]">Restablecer</button><button onClick={()=>setConfirm(false)} className="h-10 rounded-full px-4 font-semibold">No</button></div>}
      </Section>
    </div>
    <Section title={`Tarifas (${settings.tarifas.length} destinos)`} icon={I.Euro} aside={<span className="text-[13px] text-muted">Desde o hacia Santa Susanna</span>}>
      <div className="mb-3 flex h-11 items-center gap-2 rounded-xl border border-line px-3"><I.Search className="text-muted"/><input id="s-buscar" aria-label="Buscar destino" value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar destino" className="h-full min-w-0 flex-1 bg-transparent outline-none placeholder:text-muted"/></div>
      <div className="max-h-[560px] overflow-auto">
        <table className="w-full text-[14px]"><thead className="sticky top-0 bg-surface text-[12px] uppercase tracking-wider text-muted"><tr><th className="py-2 text-left">Destino</th><th className="py-2 text-right">Día</th><th className="py-2 text-right">Noche</th></tr></thead>
        <tbody className="divide-y divide-line">{tar.map(t=><tr key={t.id}><td className="py-2 pr-2"><div className="font-semibold">{t.name}</div><div className="text-[12px] text-muted">{CAT_LABEL[t.cat]}</div></td>
          <td className="py-2 text-right"><input aria-label={`Tarifa de día ${t.name}`} id={'s-t-d-'+t.id} type="number" min="0" value={t.day} onChange={e=>upT(t.id,'day',e.target.value)} className={num}/></td>
          <td className="py-2 pl-2 text-right"><input aria-label={`Tarifa de noche ${t.name}`} id={'s-t-n-'+t.id} type="number" min="0" value={t.night} onChange={e=>upT(t.id,'night',e.target.value)} className={num}/></td></tr>)}</tbody></table>
      </div>
    </Section>
  </div>;
}

function ThemeSwitch({theme,setTheme,compact}){
  const opts=[['auto','Auto',I.Monitor],['light','Claro',I.Sun],['dark','Oscuro',I.Moon]];
  if(compact){const i=opts.findIndex(o=>o[0]===theme);const n=opts[(i+1)%3];const C=opts[i][2];
    return <button onClick={()=>setTheme(n[0])} aria-label={`Tema: ${opts[i][1]}. Cambiar a ${n[1]}`} className="grid h-11 w-11 shrink-0 place-items-center rounded-full border border-line bg-surface"><C/></button>;}
  return <div className="grid grid-cols-3 gap-1 rounded-xl bg-white/5 p-1" role="group" aria-label="Tema">
    {opts.map(([k,l,C])=><button key={k} onClick={()=>setTheme(k)} aria-pressed={theme===k} className={`flex items-center justify-center gap-1.5 rounded-lg py-1.5 text-[12px] font-semibold ${theme===k?'bg-white text-[#002313]':'text-ondeep hover:bg-white/10'}`}><C size={14}/>{l}</button>)}
  </div>;
}

/* ---------- App ---------- */
const NAV=[['hoy','Hoy',I.Dash],['nueva','Apuntar reserva',I.NewB],['reservas','Reservas',I.List],['agenda','Agenda',I.Cal],['clientes','Clientes',I.Contacts],['campanas','Campañas',I.Megaphone],['ajustes','Tarifas y extras',I.Sliders]];

/* Selector de vista: cliente (web) o propietario (panel) */
function ModeBar({mode,setMode}){
  const opts=[['cliente','Vista del cliente','en la web',I.Navigation],['panel','Vista del propietario','panel privado',I.Dash]];
  return <div className="fixed inset-x-0 top-0 z-[35] border-b border-white/10 bg-[#0B1A12] text-white" style={{paddingTop:'env(safe-area-inset-top, 0px)'}}>
    <div className="mx-auto flex h-14 max-w-6xl items-center justify-between gap-3" style={{paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'}}>
      <span className="hidden text-[13px] font-semibold text-[#C9DBD1] sm:block">Demostración · cambia de vista para ver cada lado</span>
      <div className="mx-auto grid w-full max-w-md grid-cols-2 gap-1 rounded-full bg-white/10 p-1 sm:mx-0 sm:w-auto" role="tablist" aria-label="Vista">
        {opts.map(([k,l,s,C])=><button key={k} role="tab" aria-selected={mode===k} onClick={()=>setMode(k)}
          className={`flex h-10 items-center justify-center gap-2 rounded-full px-4 text-[14px] font-bold whitespace-nowrap ${mode===k?'bg-[#FFD940] text-[#002313]':'text-white hover:bg-white/10'}`}>
          <C size={16}/><span className="sm:hidden">{k==='cliente'?'Cliente':'Propietario'}</span><span className="hidden sm:inline">{l}</span></button>)}
      </div>
    </div>
  </div>;
}

/* Vista del cliente: el formulario tal como iría en su web */
function ClientSite({settings,bookings,onCreate,onSeeInPanel,theme,setTheme}){
  return <div className="min-h-full bg-bg">
    <header className="border-b border-line bg-surface">
      <div className="mx-auto flex max-w-5xl items-center justify-between gap-3 py-3" style={{paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'}}>
        <div className="flex items-center gap-3"><span className="grid h-10 w-10 place-items-center rounded-full bg-[#008F4C] text-white"><I.Car/></span>
          <div><div className="text-[15px] font-extrabold leading-tight">TAXI SANTA SUSANNA</div><div className="text-[12px] font-semibold uppercase tracking-wider text-brandink">Traslados 24 h</div></div></div>
        <ThemeSwitch theme={theme} setTheme={setTheme} compact/>
      </div>
    </header>
    <section className="bg-deep text-white">
      <div className="mx-auto max-w-5xl py-8 sm:py-10" style={{paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'}}>
        <p className="text-[13px] font-bold uppercase tracking-wider text-[#FFD940]">Reserva online</p>
        <h1 className="mt-1 text-[28px] font-extrabold leading-tight sm:text-[36px]">Reserva tu taxi en un minuto</h1>
        <div className="mt-4 flex flex-wrap gap-x-5 gap-y-2 text-[14px] text-[#D9E7DF]">
          {['Precio fijo antes de reservar','Confirmación por WhatsApp','Seguimos tu vuelo'].map(t=><span key={t} className="flex items-center gap-1.5"><span className="text-[#FFD940]"><I.Check size={16}/></span>{t}</span>)}
        </div>
      </div>
    </section>
    <div className="mx-auto max-w-5xl py-6" style={{paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'}}>
      <BookingForm settings={settings} onCreate={onCreate} onSeeInPanel={onSeeInPanel} bookings={bookings}/>
    </div>
  </div>;
}

const VISTA=(()=>{try{const v=new URLSearchParams(location.search).get('vista');return v==='panel'||v==='cliente'?v:null}catch(e){return null}})();
if(VISTA) document.documentElement.style.setProperty('--mb','0px');
function App(){
  const saved=store.get('tss-central-v5');
  const [bookings,setBookings]=useState(()=>{if(saved&&saved.bookings){seq=Math.max(seq,...saved.bookings.map(b=>+String(b.id).slice(3)||0))+1;return saved.bookings}return seed()});
  const [settings,setSettings]=useState(()=>saved&&saved.settings||DEFAULT_SETTINGS);
  const h0=location.hash.replace('#','');
  const [mode,setModeS]=useState(VISTA||(h0==='cliente'||!NAV.some(n=>n[0]===h0)?'cliente':'panel'));
  const [view,setView]=useState(NAV.some(n=>n[0]===h0)?h0:'hoy'); const [sel,setSel]=useState(null); const [toast,setToast]=useState('');
  const [campaigns,setCampaigns]=useState(()=>saved&&saved.campaigns||SEED_CAMPAIGNS());
  const [theme,setTheme]=useState(()=>store.get('tss-tema')||'auto');
  useEffect(()=>{const r=document.documentElement;if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);store.set('tss-tema',theme)},[theme]);
  useEffect(()=>{store.set('tss-central-v5',{bookings,settings,campaigns})},[bookings,settings,campaigns]);
  // Sincroniza con otras ventanas abiertas (p. ej. el móvil y el panel de la presentación)
  useEffect(()=>{const h=e=>{if(e.key!=='tss-central-v5'||!e.newValue)return;let d;try{d=JSON.parse(e.newValue)}catch(_){return}
    if(d.bookings){seq=Math.max(seq,...d.bookings.map(b=>+String(b.id).slice(3)||0))+1;
      setBookings(prev=>{const nb=d.bookings.filter(b=>!prev.some(p=>p.id===b.id));if(nb.length)setTimeout(()=>setToast(`Nueva reserva de ${nb[nb.length-1].name}`),0);return d.bookings})}
    if(d.settings)setSettings(d.settings); if(d.campaigns)setCampaigns(d.campaigns)};
    addEventListener('storage',h);return()=>removeEventListener('storage',h)},[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(t)}},[toast]);
  const update=(id,patch,logText)=>{const now=new Date().toISOString();
    const extra=patch.status==='completada'&&(settings.automations||{}).resena?[{at:now,text:'Petición de reseña en Google programada para mañana'}]:[];
    setBookings(bs=>bs.map(b=>b.id===id?{...b,...patch,log:[...b.log,...(logText?[{at:now,text:logText}]:[]),...extra]}:b));if(logText)setToast(logText)};
  const assign=(id)=>{update(id,{driverId:'d1',status:'asignada'},'Confirmada · aviso enviado por WhatsApp')};
  const create=b=>{setBookings(bs=>[...bs,b]);setToast(`Reserva ${b.id} creada`)};
  const current=bookings.find(b=>b.id===sel);
  const pendingN=bookings.filter(b=>b.status==='nueva'&&b.date>=TODAY).length;
  const title={hoy:'Hoy',nueva:'Apuntar reserva',reservas:'Reservas',agenda:'Agenda del taxi',clientes:'Clientes',campanas:'Campañas',ajustes:'Tarifas y extras'}[view];
  const sub={hoy:new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}),nueva:'Para las reservas que entran por teléfono, WhatsApp o un hotel',reservas:`${bookings.length} reservas en total`,agenda:'Horas ocupadas y libres de tu coche',clientes:'Agrupados por teléfono',campanas:'Emails y WhatsApp a tus clientes, con su permiso',ajustes:'Precios reales de la web, editables'}[view];
  const setHash=h=>{try{history.replaceState(null,'','#'+h)}catch(e){}};
  const go=v=>{setView(v);setHash(v);window.scrollTo(0,0)};
  const setMode=m=>{setModeS(m);setSel(null);setHash(m==='cliente'?'cliente':view);window.scrollTo(0,0)};
  const seeInPanel=id=>{setModeS('panel');setView('hoy');setHash('hoy');window.scrollTo(0,0);setSel(id)};
  const gut={paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'};

  return <div className="min-h-full" style={{paddingTop:'var(--mb)'}}>
    {!VISTA&&<ModeBar mode={mode} setMode={setMode}/>}

    {mode==='cliente'&&<ClientSite settings={settings} bookings={bookings} onCreate={create} onSeeInPanel={VISTA?null:seeInPanel} theme={theme} setTheme={setTheme}/>}

    {mode==='panel'&&<>
    <aside className="fixed bottom-0 left-0 z-30 hidden w-64 flex-col bg-deep p-4 text-ondeep md:flex" style={{top:'var(--mb)',paddingLeft:'max(16px, env(safe-area-inset-left, 0px))'}}>
      <div className="mb-6 flex items-center gap-3 px-1"><span className="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-[#FFD940] text-[#002313]"><I.Car/></span>
        <div className="min-w-0"><div className="whitespace-nowrap text-[14px] font-extrabold leading-tight text-white">TAXI SANTA SUSANNA</div><div className="text-[12px] font-semibold uppercase tracking-wider text-[#FFD940]">Central de reservas</div></div></div>
      <nav className="flex flex-col gap-1" aria-label="Secciones">{NAV.map(([k,l,C])=><button key={k} onClick={()=>go(k)} aria-current={view===k?'page':undefined}
        className={`flex items-center gap-3 rounded-xl px-3 py-2.5 text-left font-semibold ${view===k?'bg-white text-[#002313]':'text-ondeep hover:bg-white/10'}`}><C/><span className="flex-1">{l}</span>
        {k==='agenda'&&pendingN>0&&<span className="rounded-full bg-[#FFD940] px-2 text-[12px] font-bold text-[#002313] tnum">{pendingN}</span>}</button>)}</nav>
      <div className="mt-auto flex flex-col gap-3">
        <ThemeSwitch theme={theme} setTheme={setTheme}/>
        <div className="rounded-xl bg-white/5 p-3 text-[12px] leading-relaxed text-ondeep">Demostración con datos de ejemplo. Tarifas, hoteles y extras reales de la web.</div>
      </div>
    </aside>

    <main className="md:pl-64">
      <header className="sticky z-20 border-b border-line bg-bg/95 backdrop-blur" style={{top:'var(--mb)'}}>
        <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 py-3" style={gut}>
          <div className="min-w-0"><h1 className="truncate text-[22px] font-extrabold">{title}</h1><p className="truncate text-[13px] text-muted first-letter:uppercase">{sub}</p></div>
          <div className="flex shrink-0 items-center gap-2">
            <span className="md:hidden"><ThemeSwitch theme={theme} setTheme={setTheme} compact/></span>
            {view!=='nueva'&&<button onClick={()=>go('nueva')} aria-label="Apuntar reserva" className="flex h-11 shrink-0 items-center gap-2 rounded-full bg-brandstrong px-4 font-bold text-white"><I.Plus/><span className="hidden sm:inline">Apuntar reserva</span></button>}
            {view==='nueva'&&<button onClick={()=>go('hoy')} className="flex h-11 items-center gap-2 rounded-full border border-line bg-surface px-4 font-semibold md:hidden"><I.Back/>Panel</button>}
          </div>
        </div>
      </header>
      <div className="mx-auto max-w-6xl py-5 pb-28 md:pb-10" style={gut}>
        {view==='hoy'&&<Today bookings={bookings} open={setSel} assign={assign} settings={settings}/>}
        {view==='nueva'&&<BookingForm settings={settings} onCreate={create} staff panel bookings={bookings}/>}
        {view==='reservas'&&<Bookings bookings={bookings} open={setSel} update={update} assign={assign}/>}
        {view==='agenda'&&<Agenda bookings={bookings} open={setSel} assign={assign} settings={settings}/>}
        {view==='clientes'&&<Clients bookings={bookings} open={setSel}/>}
        {view==='campanas'&&<Campaigns bookings={bookings} settings={settings} setSettings={setSettings} campaigns={campaigns} setCampaigns={setCampaigns} toast={setToast}/>}
        {view==='ajustes'&&<Settings settings={settings} setSettings={setSettings} onReset={()=>{setBookings(seed());setSettings(DEFAULT_SETTINGS);setCampaigns(SEED_CAMPAIGNS());setToast('Datos de ejemplo restablecidos')}}/>}
      </div>
    </main>

    {view!=='nueva'&&<nav aria-label="Secciones" className="fixed inset-x-0 bottom-0 z-30 grid grid-cols-6 border-t border-line bg-surface md:hidden" style={{paddingBottom:'env(safe-area-inset-bottom, 0px)',paddingLeft:'env(safe-area-inset-left, 0px)',paddingRight:'env(safe-area-inset-right, 0px)'}}>
      {NAV.filter(n=>n[0]!=='nueva').map(([k,l,C])=><button key={k} onClick={()=>go(k)} aria-current={view===k?'page':undefined} className={`relative flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold ${view===k?'text-brandink':'text-muted'}`}>
        <C/>{l.split(' ')[0]}{k==='agenda'&&pendingN>0&&<span className="absolute right-[22%] top-1 h-2 w-2 rounded-full bg-[#E9A800]" aria-label={`${pendingN} por confirmar`}></span>}</button>)}
    </nav>}

    <Detail key={sel||'none'} b={current} close={()=>setSel(null)} update={update} bookings={bookings} open={setSel} settings={settings}/>
    </>}

    <div aria-live="polite" className="pointer-events-none fixed left-1/2 z-50 -translate-x-1/2" style={{bottom:'calc(env(safe-area-inset-bottom, 0px) + 92px)'}}>
      {toast&&<div className="rounded-full bg-deep px-4 py-2.5 text-[14px] font-semibold text-white shadow-xl">{toast}</div>}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
