  const assign=(id)=>{update(id,{driverId:'d1',status:'asignada'},'Confirmada · email de confirmación enviado')};
  const create=b=>{const l=[].concat(b);setBookings(bs=>[...bs,...l]);setToast(l.length>1?`Reservas ${l.map(x=>x.id).join(' y ')} creadas (ida y vuelta)`:`Reserva ${l[0].id} creada`)};
  const current=bookings.find(b=>b.id===sel);
  const pendingN=bookings.filter(b=>b.status==='nueva'&&b.date>=TODAY).length;
  const title={hoy:'Hoy',nueva:'Apuntar reserva',reservas:'Reservas',agenda:'Calendario',clientes:'Clientes',campanas:'Campañas',whatsapp:'Asistente de WhatsApp',ajustes:'Tarifas y extras'}[view];
  const sub={hoy:new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}),nueva:'Para las reservas que entran por teléfono, WhatsApp o un hotel',reservas:`${bookings.length} reservas en total`,agenda:'Tus viajes y los huecos libres del taxi',clientes:'Agrupados por teléfono',campanas:'Emails a tus clientes, con su permiso',whatsapp:'Ampliación disponible próximamente',ajustes:'Precios reales de la web, editables'}[view];
  const setHash=h=>{try{history.replaceState(null,'','#'+h)}catch(e){}};
  const go=v=>{if(v!=='nueva')setPrefill(null);setView(v);setHash(v);window.scrollTo(0,0)};
  const setMode=m=>{setModeS(m);setSel(null);setHash(m==='cliente'?'cliente':view);window.scrollTo(0,0)};
  const seeInPanel=id=>{setModeS('panel');setView('hoy');setHash('hoy');window.scrollTo(0,0);setSel(id)};
  const gut={paddingLeft:'max(16px, env(safe-area-inset-left, 0px))',paddingRight:'max(16px, env(safe-area-inset-right, 0px))'};

  return <div className="min-h-full" style={{paddingTop:'var(--mb)'}}>
    {!VISTA&&<ModeBar mode={mode} setMode={setMode}/>}

    {mode==='cliente'&&<ClientSite settings={settings} bookings={bookings} onCreate={create} onSeeInPanel={VISTA?null:seeInPanel} theme={theme} setTheme={setTheme}/>}

    {mode==='panel'&&<>
    <aside className="fixed bottom-0 left-0 z-30 hidden w-64 flex-col bg-deep p-4 text-ondeep md:flex" style={{top:'var(--mb)',paddingLeft:'max(16px, env(safe-area-inset-left, 0px))'}}>
      <div className="mb-6 px-1"><img src={LOGO_FULL} alt="Taxi Santa Susanna" className="h-14 w-auto"/>
        <div className="mt-2 text-[12px] font-semibold uppercase tracking-wider text-[#FFD940]">Central de reservas</div></div>
      <nav className="flex flex-col gap-1" aria-label="Secciones">{NAV.map(([k,l,C])=><button key={k} onClick={()=>go(k)} aria-current={view===k?'page':undefined}
        className={`flex items-center gap-3 rounded-xl px-3 py-2.5 text-left font-semibold ${view===k?'bg-white text-[#002313]':'text-ondeep hover:bg-white/10'}`}><C/><span className="flex-1">{l}</span>
        {k==='whatsapp'&&<span className={`rounded-full px-2 text-[11px] font-bold uppercase tracking-wide ${view===k?'bg-[#002313] text-[#FFD940]':'bg-white/15 text-[#FFD940]'}`}>Pronto</span>}
        {k==='hoy'&&pendingN>0&&<span className="rounded-full bg-[#FFD940] px-2 text-[12px] font-bold text-[#002313] tnum">{pendingN}</span>}</button>)}</nav>
      <div className="mt-auto flex flex-col gap-3">
        <ThemeSwitch theme={theme} setTheme={setTheme}/>
        <div className="rounded-xl bg-white/5 p-3 text-[12px] leading-relaxed text-ondeep">Demostración con datos de ejemplo. Tarifas, hoteles y extras reales de la web.</div>
      </div>
    </aside>

    <main className="md:pl-64">
      <header className="sticky z-20 border-b border-line bg-bg/95 backdrop-blur" style={{top:'var(--mb)'}}>
        <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 py-3" style={gut}>
          <div className="min-w-0"><h1 className="truncate text-[22px] font-extrabold">{title}</h1><p className="truncate text-[13px] text-muted first-letter:uppercase">{sub}</p></div>
          <div className="flex shrink-0 items-center gap-2">
            <span className="md:hidden"><ThemeSwitch theme={theme} setTheme={setTheme} compact/></span>
            {view!=='nueva'&&<button onClick={()=>go('nueva')} aria-label="Apuntar reserva" className="flex h-11 shrink-0 items-center gap-2 rounded-full bg-brandstrong px-4 font-bold text-white"><I.Plus/><span className="hidden sm:inline">Apuntar reserva</span></button>}
            {view==='nueva'&&<button onClick={()=>go('hoy')} className="flex h-11 items-center gap-2 rounded-full border border-line bg-surface px-4 font-semibold md:hidden"><I.Back/>Panel</button>}
          </div>
        </div>
      </header>
      <div className="mx-auto max-w-6xl py-5 pb-28 md:pb-10" style={gut}>
        {view==='hoy'&&<Today bookings={bookings} open={setSel} assign={assign} settings={settings} onStatus={(b,st)=>st==='asignada'?assign(b.id):update(b.id,{status:st},st==='en_camino'?'Marcada en camino':'Marcada completada')}/>}
        {view==='nueva'&&<BookingForm key={prefill?prefill.date+prefill.time:'nueva'} prefill={prefill} settings={settings} onCreate={create} staff panel bookings={bookings}/>}
        {view==='reservas'&&<Bookings bookings={bookings} open={setSel} update={update} assign={assign} settings={settings} onCalendar={()=>go('agenda')}/>}
        {view==='agenda'&&<Agenda bookings={bookings} open={setSel} assign={assign} settings={settings} onNew={(d,t)=>{setPrefill({date:d,time:t,retDate:d});go('nueva')}}/>}
        {view==='clientes'&&<Clients bookings={bookings} open={setSel}/>}
        {view==='campanas'&&<Campaigns bookings={bookings} settings={settings} setSettings={setSettings} campaigns={campaigns} setCampaigns={setCampaigns} toast={setToast} onWhatsApp={()=>go('whatsapp')}/>}
        {view==='whatsapp'&&<WhatsAppView settings={settings}/>}
        {view==='ajustes'&&<Settings settings={settings} setSettings={setSettings} onReset={()=>{setBookings(seed());setSettings(DEFAULT_SETTINGS);setCampaigns(SEED_CAMPAIGNS());setToast('Datos de ejemplo restablecidos')}}/>}
      </div>
    </main>

    {view!=='nueva'&&<nav aria-label="Secciones" className="fixed inset-x-0 bottom-0 z-30 grid grid-cols-6 border-t border-line bg-surface md:hidden" style={{paddingBottom:'env(safe-area-inset-bottom, 0px)',paddingLeft:'env(safe-area-inset-left, 0px)',paddingRight:'env(safe-area-inset-right, 0px)'}}>
      {NAV.filter(n=>n[0]!=='nueva'&&n[0]!=='whatsapp').map(([k,l,C])=><button key={k} onClick={()=>go(k)} aria-current={view===k?'page':undefined} className={`relative flex flex-col items-center gap-0.5 py-2 text-[11px] font-semibold ${view===k?'text-brandink':'text-muted'}`}>
        <C/>{l.split(' ')[0]}{k==='hoy'&&pendingN>0&&<span className="absolute right-[22%] top-1 h-2 w-2 rounded-full bg-[#E9A800]" aria-label={`${pendingN} por confirmar`}></span>}</button>)}
    </nav>}

    <Detail key={sel||'none'} b={current} close={()=>setSel(null)} update={update} bookings={bookings} open={setSel} settings={settings}/>
    </>}

    <div aria-live="polite" className="pointer-events-none fixed left-1/2 z-50 -translate-x-1/2" style={{bottom:'calc(env(safe-area-inset-bottom, 0px) + 92px)'}}>
      {toast&&<div className="rounded-full bg-deep px-4 py-2.5 text-[14px] font-semibold text-white shadow-xl">{toast}</div>}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
