function spanOf(b,s){ const t=toMin(b.time), one=legMin(b.dest,s); return b.dir==='in'?{a:t-one,e:t+one}:{a:t,e:t+2*one}; }

function clientsOf(bookings){
  const map={};
  [...bookings].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(b=>{const pk=phoneKey(b.phone);const c=(map[pk]=map[pk]||{name:b.name,phone:b.phone,lang:b.lang,email:'',marketing:false,list:[]});
    c.list.push(b); c.name=b.name; c.lang=b.lang; if(b.email)c.email=b.email; if(b.marketing!==undefined)c.marketing=!!b.marketing;});
  return Object.values(map).map(c=>{const ok=c.list.filter(b=>b.status!=='cancelada');const dates=ok.map(b=>b.date).sort();
    return {...c,count:ok.length,spent:ok.reduce((s,b)=>s+b.total,0),first:dates[0]||c.list[0].date,last:dates[dates.length-1]||c.list[0].date,
      airport:ok.some(b=>isAirport(b.dest)),daysSince:dates.length?Math.round((new Date(TODAY)-new Date(dates[dates.length-1]))/864e5):9999}});
}

function Stepper({id,value,onChange,min=0,max=8,label}){
  return <div className="inline-flex items-center rounded-full border border-line bg-surface" role="group" aria-label={label}>
    <button type="button" id={id+'-menos'} aria-label={`Quitar ${label}`} disabled={value<=min} onClick={()=>onChange(Math.max(min,value-1))}
      className="grid h-11 w-11 place-items-center rounded-full text-ink disabled:opacity-30 hover:bg-sunken"><I.Minus/></button>
    <span className="w-7 text-center font-bold tnum" aria-live="polite">{value}</span>
    <button type="button" id={id+'-mas'} aria-label={`Añadir ${label}`} disabled={value>=max} onClick={()=>onChange(Math.min(max,value+1))}
      className="grid h-11 w-11 place-items-center rounded-full text-ink disabled:opacity-30 hover:bg-sunken"><I.Plus/></button>
  </div>;
}

function Combo({id,value,onChange,options,placeholder,icon:Icn}){
  const [q,setQ]=useState(''); const [open,setOpen]=useState(false); const [hi,setHi]=useState(0); const ref=useRef(null);
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h)},[]);
  const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const list=useMemo(()=>{const nq=norm(q.trim());if(!nq)return options;
    const score=o=>{const l=norm(o.label);if(l.startsWith(nq))return 0;if(l.split(/[^a-z0-9]+/).some(w=>w.startsWith(nq)))return 1;if(l.includes(nq))return 2;if(norm(o.group||'').includes(nq))return 3;return 9};
    return options.map(o=>({o,s:score(o)})).filter(x=>x.s<9).sort((a,b)=>a.s-b.s).map(x=>({...x.o,group:q?(x.s<3?'Coincidencias':'En la misma zona'):x.o.group}))},[q,options]);
  const pick=o=>{onChange(o);setQ('');setOpen(false)};
  let lastGroup=null;
  return <div ref={ref} className="relative">
    <div className="flex h-12 items-center gap-2 rounded-xl border border-line bg-surface px-3.5 focus-within:border-brand">
      <span className="text-muted">{Icn&&<Icn/>}</span>
      <input id={id} role="combobox" aria-expanded={open} aria-controls={id+'-lista'} aria-autocomplete="list" aria-activedescendant={open&&list[hi]?id+'-opt-'+hi:undefined} autoComplete="off"
        className="h-full min-w-0 flex-1 bg-transparent text-[16px] outline-none placeholder:text-muted"
        placeholder={value?value.label:placeholder} value={open?q:(value?value.label:'')}
        onFocus={()=>{setOpen(true);setHi(0)}} onChange={e=>{setQ(e.target.value);setOpen(true);setHi(0)}}
        onKeyDown={e=>{if(e.key==='ArrowDown'){e.preventDefault();setHi(h=>Math.min(h+1,list.length-1))}else if(e.key==='ArrowUp'){e.preventDefault();setHi(h=>Math.max(h-1,0))}else if(e.key==='Enter'&&open&&list[hi]){e.preventDefault();pick(list[hi])}else if(e.key==='Escape'){setOpen(false)}}}/>
      {value&&!open&&<button type="button" aria-label="Borrar" onClick={()=>onChange(null)} className="text-muted hover:text-ink"><I.X/></button>}
    </div>
    {open&&<ul id={id+'-lista'} role="listbox" className="absolute z-30 mt-1 max-h-72 w-full overflow-auto rounded-xl border border-line bg-surface py-1 shadow-xl">
      {list.length===0&&<li className="px-4 py-3 text-muted">No encontramos ese lugar. Escríbelo en comentarios o pregúntanos por WhatsApp.</li>}
      {list.map((o,i)=>{const head=o.group!==lastGroup;lastGroup=o.group;return <React.Fragment key={o.key}>
        {head&&<li className="px-4 pb-1 pt-2 text-[12px] font-bold uppercase tracking-wider text-muted" role="presentation">{o.group}</li>}
        <li id={id+'-opt-'+i} role="option" aria-selected={i===hi} onMouseEnter={()=>setHi(i)} onMouseDown={e=>{e.preventDefault();pick(o)}}
          className={`flex cursor-pointer items-center justify-between gap-3 px-4 py-2.5 ${i===hi?'bg-sunken':''}`}>
          <span className="min-w-0 truncate">{o.label}</span>{o.right&&<span className="shrink-0 text-[13px] font-semibold text-muted tnum">{o.right}</span>}
        </li></React.Fragment>})}
    </ul>}
  </div>;
}

function Notice({tone='warn',icon,title,children,action,onClick}){
  const T={bad:'bg-badsoft text-bad',warn:'bg-warnsoft text-warn',info:'bg-infosoft text-info',ok:'bg-oksoft text-ok'}[tone];
  const Tag=onClick?'button':'div';
  return <Tag type={onClick?'button':undefined} onClick={onClick} role={onClick?undefined:'status'}
    className={`flex w-full items-center gap-3 rounded-xl border border-line bg-surface p-3 text-left text-[14px] text-ink ${onClick?'transition hover:bg-sunken':''}`}>
    <span className={`grid h-9 w-9 shrink-0 place-items-center rounded-full ${T}`}>{icon||<I.Alert size={18}/>}</span>
    <span className="min-w-0 flex-1"><span className="block font-semibold leading-snug">{title}</span>{children&&<span className="mt-0.5 block text-[13px] text-muted">{children}</span>}</span>
    {action}{onClick&&<I.Chev className="shrink-0 text-muted"/>}

}

  const dest = f.from&&f.from.type==='dest'?f.from:(f.to&&f.to.type==='dest'?f.to:null);
  const dir = f.from&&f.from.type==='ss'?'out':'in';
  const maxSeats=settings.seats||4; const seats = seatsOf(f.pax,f.extras); const vehicle = vehicleFor(seats,maxSeats);
  const lead = d => dest&&d==='in'?legMin(dest.label,settings):0;
  const clash = ss&&dest&&f.time ? conflictsOf({id:'nuevo',date:f.date,time:f.time,dest:dest.label,dir},bookings||[],settings) : [];
  const freeFrom = clash.length ? toHM(Math.max(...clash.map(x=>spanOf(x,settings).e))+lead(dir)) : null;
  const retDir = dir==='out'?'in':'out';
  const clashRet = f.roundTrip&&ss&&dest&&f.retDate&&f.retTime ? conflictsOf({id:'nuevo-v',date:f.retDate,time:f.retTime,dest:dest.label,dir:retDir},bookings||[],settings) : [];
  const freeRet = clashRet.length ? toHM(Math.max(...clashRet.map(x=>spanOf(x,settings).e))+lead(retDir)) : null;
  // Ida y vuelta el mismo día: la vuelta no puede empezar antes de que el taxi acabe la ida
  const pairClash = f.roundTrip&&ss&&dest&&f.time&&f.retTime&&f.retDate===f.date && (()=>{const a=spanOf({time:f.time,dest:dest.label,dir},settings),b=spanOf({time:f.retTime,dest:dest.label,dir:retDir},settings);return a.a<b.e&&b.a<a.e})();
  const q = ss&&dest ? quote({dest:dest.label,time:f.time||'12:00',date:f.date,retDate:f.retDate,retTime:f.retTime||'12:00',roundTrip:f.roundTrip,extras:f.extras,vehicle},settings) : null;
  const airport = dest && /Aeropuerto/.test(dest.label);
  const bigBags = f.luggage.l + f.luggage.m;
  const quick = ['Aeropuerto Barcelona-El Prat','Aeropuerto Girona-Costa Brava','Barcelona Sants','Port de Barcelona'];
  const setQuick = (side,name) => { const o=destOpts.find(x=>x.label===name); const other=side==='from'?'to':'from';
    setF(p=>({...p,[side]:o,[other]:p[other]&&p[other].type==='dest'?null:p[other]}));
    setErrors(e=>{if(!e.route)return e;const n={...e};delete n.route;return n});
    if(!f[other]||f[other].type==='dest') setTimeout(()=>{const el=document.getElementById(other==='from'?'f-desde':'f-hasta');el&&el.focus()},0); };
  const Chips = ({side}) => { const cur=f[side]; return <div className="flex flex-wrap items-center gap-2 pb-1 pt-1"><span className="shrink-0 text-[13px] font-semibold text-muted">{side==='from'?'Frecuentes:':'Frecuentes:'}</span>
    {quick.map(n=>{const on=!!cur&&cur.label===n;return <button type="button" key={n} onClick={()=>setQuick(side,n)} aria-pressed={on} className={`shrink-0 whitespace-nowrap rounded-full border px-3 py-1.5 text-[13px] font-semibold ${on?'border-brand bg-brandsoft text-brandink':'border-line hover:border-brand'}`}>{n.replace('Aeropuerto ','Aeropuerto de ').replace('-El Prat','').replace('-Costa Brava','')}</button>})}</div>; };

  function submit(e){
    e.preventDefault();
    const er={};
    if(!ss||!dest) er.route='Elige desde dónde y a dónde vas.';
    if(!f.date) er.date='Elige el día.'; if(!f.time) er.time='Elige la hora de recogida.';
    if(f.date && f.date<TODAY) er.date='La fecha ya ha pasado.';
    if(!staff&&f.date===TODAY&&f.time&&f.time<nowHM()) er.time='Esa hora ya ha pasado. Elige una hora más tarde.';
    if(f.roundTrip&&(!f.retDate||!f.retTime)) er.ret='Indica el día y la hora de vuelta.';
    else if(f.roundTrip&&f.time&&(f.retDate+f.retTime)<=(f.date+f.time)) er.ret='La vuelta tiene que ser después de la ida.';
    else if(pairClash) er.ret='La vuelta es demasiado pronto: el taxi aún está haciendo la ida.';
    else if(!staff&&clashRet.length) er.ret=`A esa hora de vuelta ya tenemos un viaje. Prueba a partir de las ${freeRet}.`;
    if(vehicle==='grupo') er.pax=seats<=8?`Para ${seats} personas usamos una van de hasta 8 plazas (con suplemento). Escríbenos por WhatsApp o llama al 937 67 85 71 y te damos el precio.`:`Para más de 8 personas usamos varios vehículos. Llámanos al 937 67 85 71 y lo organizamos.`;
    if(!staff&&clash.length) er.time=`A esa hora ya tenemos un viaje. Prueba a partir de las ${freeFrom}.`;
    if(!f.name.trim()) er.name='Escribe tu nombre.';
    if(f.phone.replace(/\D/g,'').length<6) er.phone='Escribe un teléfono válido.';
    if(f.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) er.email='Escribe un email válido.';
    else if(!staff&&!f.email.trim()) er.email='Necesitamos tu email para enviarte la confirmación.';
    if(!staff&&!f.terms) er.terms='Acepta las condiciones para reservar.';
    setErrors(er); if(Object.keys(er).length){ const first=document.querySelector('[data-err="1"]'); if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    const tel=f.phone.trim(); const pre=tel.startsWith('+')?(Object.keys(LANG_BY_PREFIX).find(p=>tel.startsWith(p))||''):f.prefix;
    const now=new Date().toISOString();
    const b={id:newCode(),createdAt:now,channel:f.channel,date:f.date,time:f.time,dir,ss:ss.label,dest:dest.label,pax:f.pax,luggage:f.luggage,
      extras:f.extras,vehicle,flight:f.flight.trim(),name:f.name.trim(),phone:tel.startsWith('+')?tel:(f.prefix+' '+tel).trim(),email:f.email.trim(),
      notes:[f.extras.ruedas&&!f.wheelFoldable?'Silla de ruedas NO plegable: buscar taxi con rampa.':'',f.notes.trim()].filter(Boolean).join(' '),
      lang:LANG_BY_PREFIX[pre]||'EN',marketing:f.marketing,payment:f.payment,
      // Solo cuenta como pagado si lo paga el cliente en la web; si la toma el equipo, queda «a cobrar» hasta marcarlo
      paid:!staff&&f.payment!=='conductor',status:'nueva',driverId:null,roundTrip:f.roundTrip,retDate:f.roundTrip?f.retDate:null,retTime:f.roundTrip?f.retTime:null,
      total:q.out.price+(f.roundTrip?q.extras/2:q.extras),night:q.out.night,log:[{at:now,text:`Reserva creada por ${CHANNEL[f.channel]}`},...(f.email.trim()?[{at:now,text:'Email de reserva recibida enviado'}]:[])]};
    const list=[b];
    if(f.roundTrip){ const r={...b,id:newCode(),date:f.retDate,time:f.retTime,dir:retDir,roundTrip:false,retDate:null,retTime:null,isReturn:true,linked:b.id,
      flight:'',total:q.ret.price+q.extras/2,night:q.ret.night,log:[{at:now,text:`Vuelta de la reserva ${b.id}`}]}; b.linked=r.id; list.push(r); }
    const finish=()=>{onCreate(list); setDone({...b,grand:q.total,retId:b.linked}); setF(emptyForm()); setErrors({}); window.scrollTo(0,0);};
    if(!staff&&f.payment==='online'){ setPaying({total:q.total,finish:m=>{list.forEach(x=>{x.paid=true;x.log.push({at:new Date().toISOString(),text:`Pagado con ${m} (pedido de WooCommerce)`})});finish();}}); window.scrollTo(0,0); return; }
    if(staff&&f.payment==='online') list.forEach(x=>{x.paid=false;x.log.push({at:now,text:'Enlace de pago creado'})});
    finish();
  }

  if(paying) return <PayDemo total={paying.total} onPay={m=>{const p=paying;setPaying(null);p.finish(m)}} onBack={()=>setPaying(null)}/>;
  if(done) return <Confirmation b={done} onNew={()=>setDone(null)} staff={staff} onSeeInPanel={onSeeInPanel}/>;

  const errCount=Object.keys(errors).length;
  return <form onSubmit={submit} noValidate className="mx-auto grid max-w-2xl gap-5 pb-28 md:max-w-none lg:grid-cols-[minmax(0,1fr)_300px] lg:items-start lg:pb-0">
    <div className={`grid min-w-0 content-start gap-4 ${staff?'md:grid-cols-2':''}`}>
    {errCount>0&&<div role="alert" className={staff?'md:col-span-2':''}><Notice tone="bad" title={`Revisa ${errCount===1?'el campo marcado':`los ${errCount} campos marcados`}`}>Faltan datos para completar la reserva.</Notice></div>}
    {staff&&<div className="flex flex-wrap items-center gap-2 rounded-2xl border border-line bg-surface p-3 md:col-span-2">
      <span className="text-[13px] font-semibold uppercase tracking-wide text-muted">Reserva tomada por</span>
      {Object.entries(CHANNEL).map(([k,v])=><button type="button" key={k} onClick={()=>set('channel',k)} className={`rounded-full px-3 py-1.5 text-[14px] font-semibold ${f.channel===k?'bg-deep text-white':'bg-sunken text-ink'}`}>{v}</button>)}
    </div>}

    <Section title={staff?"Trayecto":"1. ¿A dónde vas?"} icon={I.Route}>
      {!staff&&!q&&<div className="mb-4">
        <h3 className="mb-2 text-[14px] font-semibold text-ink">Traslados en taxi más reservados</h3>
        <div className="mb-3 grid grid-cols-2 gap-1 rounded-full bg-sunken p-1" role="group" aria-label="Sentido del viaje">
          {[[false,'Salgo de Santa Susanna'],[true,'Llego a Santa Susanna']].map(([v,l])=><button type="button" key={l} aria-pressed={arrive===v} onClick={()=>setArrive(v)}
            className={`min-h-[44px] rounded-full px-3 text-[14px] font-semibold leading-tight ${arrive===v?'bg-deep text-white':'text-ink hover:bg-surface'}`}>{l}</button>)}
        </div>
        <div className="grid grid-cols-2 gap-2">{quick.map(n=>{const t=settings.tarifas.find(x=>x.name===n);if(!t)return null;const on=(arrive?f.from:f.to)&&(arrive?f.from:f.to).label===n;const dur=(t.info.split('·')[1]||'').trim();
          return <button type="button" key={n} onClick={()=>setQuick(arrive?'from':'to',n)} aria-pressed={!!on} className={`rounded-xl border p-3 text-left transition ${on?'border-brand bg-brandsoft':'border-line hover:border-brand'}`}>
            <span className="block text-[12px] font-semibold uppercase tracking-wide text-muted">{arrive?'→ Santa Susanna desde':'Santa Susanna →'}</span><span className="block text-[14px] font-semibold leading-snug">{n.replace('Aeropuerto Barcelona-El Prat','Aeropuerto de Barcelona (El Prat)').replace('Aeropuerto Girona-Costa Brava','Aeropuerto de Girona')}</span>
            <span className="mt-1 block text-[13px] text-muted">desde <b className="text-[15px] text-ink tnum">{eur(t.day)}</b></span>{dur&&<span className="block text-[12px] text-muted">{dur}</span>}</button>})}</div>
        <p className="mt-2 text-[13px] text-muted">{arrive?'Después, elige tu hotel o dirección en Santa Susanna.':'Después, elige tu hotel o dirección de recogida en Santa Susanna.'}</p>
      </div>}
      <div className="grid gap-2" data-err={errors.route?1:0}>
        <Field label="Desde" htmlFor="f-desde"><Combo id="f-desde" value={f.from} onChange={v=>set('from',v)} options={fromOpts} placeholder="Hotel, aeropuerto, estación…" icon={I.Pin}/></Field>
        {staff&&<Chips side="from"/>}
        <div className="flex justify-center"><button type="button" aria-label="Intercambiar origen y destino" onClick={()=>setF(p=>({...p,from:p.to,to:p.from}))}
          className="grid h-10 w-10 place-items-center rounded-full border border-line bg-surface text-brandink hover:bg-sunken"><I.Swap/></button></div>
        <Field label="Hasta" htmlFor="f-hasta" error={errors.route}><Combo id="f-hasta" value={f.to} onChange={v=>set('to',v)} options={toOpts} placeholder="¿A dónde vas?" icon={I.Flag}/></Field>
        {staff&&<Chips side="to"/>}
      </div>
      {q&&<div className="mt-4 flex items-center justify-between gap-3 rounded-xl bg-brandsoft p-3.5">
        <div className="min-w-0"><div className="text-[13px] font-semibold text-brandink">Precio fijo · {q.out.night?'tarifa de noche':'tarifa de día'}{f.roundTrip?' · ida y vuelta':''}</div>
          <div className="truncate text-[14px] text-ink">{q.tariff.info||CAT_LABEL[q.tariff.cat]}</div></div>
        <div className="text-[26px] font-extrabold text-ink tnum">{eur(q.total)}</div>
      </div>}
    </Section>

    <Section title={staff?"Cuándo":"2. ¿Cuándo te recogemos?"} icon={I.Cal}>
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label="Día" htmlFor="f-dia" error={errors.date}><input id="f-dia" type="date" min={TODAY} value={f.date} onChange={e=>set('date',e.target.value)} className={inputCls} data-err={errors.date?1:0}/></Field>
        <Field label="Hora de recogida" htmlFor="f-hora" error={errors.time} hint={f.time?(isHoliday(f.date,settings)?'Tarifa de fin de semana y festivos':isNight(f.time,settings,f.date)?`Tarifa de noche (de ${settings.nightFrom} a ${settings.nightTo})`:'Tarifa de día'):''}>
          <div className="flex gap-2"><input id="f-hora" type="time" value={f.time} onChange={e=>set('time',e.target.value)} className={inputCls} data-err={errors.time?1:0}/>
          {staff&&<button type="button" onClick={()=>{set('date',TODAY);set('time',nowHM())}} className="shrink-0 rounded-xl border border-line px-3.5 text-[14px] font-semibold hover:border-brand">Ahora</button>}</div></Field>
      </div>
      {clash.length>0&&<div className="mt-3"><Notice tone={staff?'warn':'bad'} icon={<I.Clock size={18}/>}

        action={<button type="button" onClick={()=>set('time',freeFrom)} className="shrink-0 rounded-full border border-line px-3 py-1.5 text-[13px] font-semibold hover:border-brand">Elegir las {freeFrom}</button>}>
        Queda libre a partir de las {freeFrom}.</Notice></div>}
      <label className="mt-4 flex cursor-pointer items-center justify-between gap-3 rounded-xl bg-sunken p-3.5" htmlFor="f-vuelta">
        <span className="flex items-center gap-2 font-semibold"><I.Repeat/>Ida y vuelta</span>
        <input id="f-vuelta" type="checkbox" className="peer sr-only" checked={f.roundTrip} onChange={e=>set('roundTrip',e.target.checked)}/>
        <span className="relative h-7 w-12 rounded-full bg-line transition peer-checked:bg-brandstrong after:absolute after:left-1 after:top-1 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition peer-checked:after:translate-x-5 peer-focus-visible:ring-2 peer-focus-visible:ring-brand peer-focus-visible:ring-offset-2" aria-hidden="true"></span>
      </label>
      {f.roundTrip&&<div className="mt-3 grid gap-3 sm:grid-cols-2" data-err={errors.ret?1:0}>
        <Field label="Día de vuelta" htmlFor="f-dia-v"><input id="f-dia-v" type="date" min={f.date} value={f.retDate} onChange={e=>set('retDate',e.target.value)} className={inputCls}/></Field>
        <Field label="Hora de vuelta" htmlFor="f-hora-v" error={errors.ret}><input id="f-hora-v" type="time" value={f.retTime} onChange={e=>set('retTime',e.target.value)} className={inputCls}/></Field>
      </div>}
      {f.roundTrip&&!pairClash&&clashRet.length>0&&<div className="mt-3"><Notice tone={staff?'warn':'bad'} icon={<I.Clock size={18}/>}
        title={staff?`La vuelta se solapa con ${clashRet.map(x=>`${x.name} (${x.time})`).join(', ')}`:'A esa hora de vuelta el taxi ya está ocupado'}
        action={<button type="button" onClick={()=>set('retTime',freeRet)} className="shrink-0 rounded-full border border-line px-3 py-1.5 text-[13px] font-semibold hover:border-brand">Elegir las {freeRet}</button>}>
        Queda libre a partir de las {freeRet}.</Notice></div>}
    </Section>

    <Section title={staff?"Viajeros y equipaje":"3. Viajeros y equipaje"} icon={I.Users}>
      <div className="flex items-center justify-between gap-3 border-b border-line pb-3" data-err={errors.pax?1:0}>
        <div><div className="font-semibold">Pasajeros</div><div className="text-[13px] text-muted">Bebés y niños también cuentan</div></div>
        <Stepper id="f-pax" label="pasajeros" value={f.pax} min={1} max={8} onChange={v=>set('pax',v)}/>
      </div>
      {MALETAS.map(m=><div key={m.id} className="flex items-center justify-between gap-3 border-b border-line py-3">
        <div className="flex items-center gap-3"><span className="text-muted"><I.Lug/></span><div><div className="font-semibold">Maleta {m.name.toLowerCase()}</div><div className="text-[13px] text-muted tnum">{m.dims}</div></div></div>
        <Stepper id={'f-mal-'+m.id} label={'maletas '+m.name.toLowerCase()} value={f.luggage[m.id]} max={8} onChange={v=>set('luggage',{...f.luggage,[m.id]:v})}/>
      </div>)}
      <div className={`mt-3 flex items-start gap-3 rounded-xl p-3.5 ${vehicle==='grupo'?'bg-badsoft text-bad':'bg-sunken'}`}>
        <span className="mt-0.5">{vehicle==='grupo'?<I.Alert/>:<I.Car/>}</span>
        <div className="text-[14px]">{vehicle==='taxi'&&<><b>Taxi</b> · hasta {maxSeats} plazas{f.extras.golf?` (las bolsas de golf ocupan plaza: vais ${seats})`:''}.{bigBags>4&&<> Con tanto equipaje grande, indícalo en comentarios para confirmar que cabe.</>}</>}
          {vehicle==='grupo'&&<>{seats<=8?<><b>Sois {seats}: os llevamos en una van de hasta 8 plazas.</b> Tiene suplemento: escríbenos por WhatsApp o llama al 937 67 85 71 y te damos el precio.</>:<><b>Sois {seats}: hacen falta varios vehículos.</b> Llámanos al 937 67 85 71 y lo organizamos.</>}</>}
          {errors.pax&&vehicle!=='grupo'&&<div className="font-semibold text-bad">{errors.pax}</div>}</div>
      </div>
    </Section>

    <Section title={staff?"Necesidades especiales":"4. ¿Necesitas algo más?"} icon={I.Wheel} aside={<span className="text-[13px] text-muted">Opcional</span>}>
      {(()=>{const chosen=settings.extras.filter(e=>f.extras[e.id]);return !showExtras&&<div className="flex flex-col gap-3">
        {chosen.length>0?<div className="flex flex-wrap gap-2">{chosen.map(e=><span key={e.id} className="rounded-full bg-brandsoft px-3 py-1 text-[13px] font-semibold text-brandink">{f.extras[e.id]}× {e.name}</span>)}</div>
          :<p className="text-[14px] text-muted">Sillita o elevador infantil, carrito, silla de ruedas, bicicleta, bolsa de golf, mascota o una parada adicional.</p>}
        <button type="button" onClick={()=>setShowExtras(true)} aria-expanded="false" className="flex h-11 items-center justify-center gap-2 rounded-xl border border-dashed border-line font-semibold text-brandink hover:border-brand"><I.Plus/>{chosen.length?'Cambiar necesidades':'Añadir necesidades'}</button>
      </div>})()}
      {showExtras&&<>
      <div className="grid gap-2">

          <div className="flex min-w-0 items-center gap-3"><span className="text-brandink"><C/></span><div className="min-w-0"><div className="font-semibold">{e.name}</div>
            <div className="text-[13px] text-muted">{e.price?`${eur(e.price)} · `:'Gratis · '}{e.hint}</div></div></div>
          <Stepper id={'f-ex-'+e.id} label={e.name.toLowerCase()} value={v} max={e.max} onChange={n=>set('extras',{...f.extras,[e.id]:n})}/>

      </div>
      {f.extras.ruedas>0&&<div className="mt-3 flex flex-wrap items-center gap-3 rounded-xl bg-sunken p-3.5 text-[14px]">

        {!f.wheelFoldable&&<span className="w-full text-warn">Buscaremos un taxi con rampa y te confirmaremos la disponibilidad.</span>}
      </div>}
      <button type="button" onClick={()=>setShowExtras(false)} aria-expanded="true" className="mt-3 w-full text-center text-[14px] font-semibold text-muted underline underline-offset-2 hover:text-ink">Listo</button>
      </>}
      {f.extras.parada>0&&<p className="mt-3 text-[14px] text-muted">Indica en comentarios dónde es la parada adicional.</p>}
    </Section>

    <Section title={staff?"Tus datos":"5. Tus datos"} icon={I.Contacts} className={staff?'md:col-span-2':''}>
      <div className="grid gap-3 sm:grid-cols-2">
        <Field label="Nombre y apellidos" htmlFor="f-nombre" error={errors.name}><input id="f-nombre" autoComplete="name" value={f.name} onChange={e=>set('name',e.target.value)} className={inputCls} data-err={errors.name?1:0}/></Field>
        <Field label="Teléfono (WhatsApp)" htmlFor="f-tel" error={errors.phone} hint="Por si tenemos que avisarte el día del viaje">
          <div className="flex gap-2"><select id="f-prefijo" aria-label="Prefijo" value={f.prefix} onChange={e=>set('prefix',e.target.value)} className="h-12 rounded-xl border border-line bg-surface px-2 text-[16px]">
            {['+34','+44','+33','+49','+31','+32','+39','+351','+353','+41','+43','+45','+46','+47','+48','+420','+1'].map(p=><option key={p}>{p}</option>)}</select>
          <input id="f-tel" type="tel" autoComplete="tel-national" inputMode="tel" value={f.phone} onChange={e=>set('phone',e.target.value)} onBlur={()=>{if(f.phone.trim()&&f.phone.replace(/\D/g,'').length<6)setErrors(e=>({...e,phone:'Escribe un teléfono válido.'}))}} aria-invalid={!!errors.phone} className={inputCls} data-err={errors.phone?1:0}/></div></Field>
        <div className="grid gap-3 sm:col-span-2 sm:grid-cols-2">

function WaPreview({b}){
  const msgs=[{t:'Hemos recibido tu reserva',x:`${dayLabel(b.date)} a las ${b.time} · ${tripName(b)} · ${eur(b.grand||b.total)} · Código ${b.id}.${b.paid&&b.payment!=='conductor'?' Pago recibido.':''} Te confirmamos en breve.`}];
  if(['asignada','en_camino','completada'].includes(b.status)) msgs.push({t:'Reserva confirmada',x:`Te recogemos ${dayLabel(b.date).toLowerCase()} a las ${b.time}. Si necesitas cambiar algo, responde a este email.`});
  if(b.status==='cancelada') msgs.push({t:'Reserva cancelada',x:'Tu reserva ha sido cancelada. Si no lo esperabas, responde a este email o llámanos.'});
  if(!b.email) return <div className="rounded-2xl border border-dashed border-line p-3 text-[14px] text-muted">Sin email: los avisos se le dan por WhatsApp o teléfono.</div>;
  return <div className="rounded-2xl bg-sunken p-3" aria-label="Emails al cliente">
    <div className="mb-2 flex items-center gap-1.5 text-[12px] font-bold uppercase tracking-wider text-muted"><I.Mail size={14}/>Emails automáticos a {b.email}</div>
    <div className="flex flex-col gap-2">{msgs.map((m,i)=><div key={i} className="rounded-xl border border-line bg-surface px-3 py-2 text-[14px]">
      <div className="font-bold text-brandink">{m.t}</div>{m.x}</div>)}</div>
  </div>;
}

/* ---------- Panel de hoy ---------- */
function TrendChart({bookings}){
  const days=Array.from({length:14},(_,i)=>addDays(i-13));
  const data=days.map(d=>{const l=bookings.filter(b=>b.date===d&&b.status!=='cancelada');return {d,n:l.length,eur:l.reduce((s,b)=>s+b.total,0)}});
  const max=Math.max(1,...data.map(x=>x.n));
  const thisW=data.slice(7).reduce((s,x)=>s+x.n,0), lastW=data.slice(0,7).reduce((s,x)=>s+x.n,0);
  const diff=lastW?Math.round((thisW-lastW)/lastW*100):0;
  const [hover,setHover]=useState(null); const h=hover!==null?data[hover]:null;
  return <div className="rounded-2xl border border-line bg-surface p-4">
    <div className="mb-4 flex flex-wrap items-end justify-between gap-3">
      <div><h2 className="font-bold">Reservas de los últimos 14 días</h2>
        <p className="text-[13px] text-muted">{h?`${new Date(h.d+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}: ${h.n} reserva${h.n===1?'':'s'} · ${eur(h.eur)}`:'Pasa por encima de una barra para ver el detalle'}</p></div>
      <div className="text-right"><div className="text-[13px] text-muted">Últimos 7 días</div><div className="text-[20px] font-extrabold tnum">{thisW} <span className={`text-[13px] font-bold ${diff>=0?'text-ok':'text-bad'}`}>{diff>=0?'+':''}{diff} % vs. semana anterior</span></div></div>
    </div>
    <div className="flex h-32 items-end" role="group" aria-label="Reservas por día de los últimos 14 días">
      {data.map((x,i)=><button key={x.d} type="button" onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} onFocus={()=>setHover(i)} onBlur={()=>setHover(null)}
        aria-label={`${dayLabel(x.d)}: ${x.n} reservas`} className="group flex h-full min-w-0 flex-1 flex-col justify-end px-[3px]">
        <span className={`block w-full rounded-t-md transition ${x.d===TODAY?'bg-gold':i>=7?'bg-brand':'bg-line'} ${hover===i?'opacity-80':''}`} style={{height:`${Math.max(4,x.n/max*100)}%`}}></span></button>)}
    </div>
    <div className="mt-1.5 flex text-[12px] text-muted tnum">{data.map(x=><span key={x.d} className="min-w-0 flex-1 text-center">{x.d===TODAY?'Hoy':new Date(x.d+'T12:00').getDate()}</span>)}</div>
  </div>;
}
function Today({bookings,open,assign,settings,onStatus}){
  const today=bookings.filter(b=>b.date===TODAY&&b.status!=='cancelada').sort((a,b)=>a.time.localeCompare(b.time));
  const pending=bookings.filter(b=>b.status==='nueva'&&b.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const income=today.reduce((s,b)=>s+b.total,0);
  const toCollect=today.filter(b=>!b.paid).reduce((s,b)=>s+b.total,0);
  const now=nowHM();
  const unpaid=bookings.filter(b=>!b.paid&&b.date>=TODAY&&b.status!=='cancelada'&&b.status!=='completada');
  const alerts=today.filter(b=>b.status!=='completada'&&(b.status==='nueva'||b.flightNote)).map(b=>({b,
    text:[b.status==='nueva'?(b.time<now?`Sin confirmar y la recogida era a las ${b.time}`:`Sin confirmar · recogida a las ${b.time} (${untilLabel(b.time)})`):null,b.flightNote].filter(Boolean).join(' · '),
    tone:b.status==='nueva'?'warn':'info'}));
  // La siguiente: la que está en camino o la primera pendiente desde hace 30 min (por si va con retraso)
  const nextB=today.find(b=>b.status==='en_camino')||today.find(b=>b.status!=='completada'&&toMin(b.time)>=toMin(now)-30);
  const upcoming=bookings.filter(b=>b.date>TODAY&&b.status!=='cancelada'&&b.status!=='pago_pendiente').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  const clashes=today.filter(b=>b.status!=='completada').map(b=>({b,c:conflictsOf(b,today,settings)})).filter(x=>x.c.length&&x.c.every(c=>c.time>=x.b.time));
  unpaid.forEach(b=>alerts.push({b,text:`Sin pagar · ${dayLabel(b.date)} ${b.time}: envíale el enlace de pago`,tone:'warn'}));
  clashes.forEach(({b,c})=>alerts.unshift({b,text:`Se solapa con la recogida de las ${c.map(x=>x.time).join(' y ')}: el taxi no llega a las dos`,tone:'bad'}));
  const busy=today.reduce((s,b)=>s+busyMin(b.dest,settings),0); const hours=settings.workHours||14; const occ=Math.min(100,Math.round(busy/(hours*60)*100));
  const tiles=[{k:'Viajes hoy',v:today.length,s:`${today.filter(b=>b.status==='completada').length} completados`},{k:'Por confirmar',v:pending.length,s:'de hoy en adelante',tone:pending.length?'text-warn':''},
    {k:'Facturación de hoy',v:eur(income),s:toCollect?`${eur(toCollect)} pendiente de pago`:'Todo pagado'},{k:'Taxi ocupado hoy',v:`${occ} %`,s:`${hrs(busy)} h de ${hours} h de trabajo`,bar:occ}];
  return <div className="flex flex-col gap-5">
    {onStatus&&(nextB?<NextCard b={nextB} settings={settings} onStatus={onStatus} open={open}/>:<NoNextCard up={upcoming} open={open}/>)}
    <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">{tiles.map(t=><div key={t.k} className="min-w-0 rounded-2xl border border-line bg-surface p-4">
      <div className="text-[13px] font-semibold text-muted">{t.k}</div><div className={`mt-1 text-[26px] font-extrabold tnum ${t.tone||''}`}>{t.v}</div><div className="text-[13px] text-muted">{t.s}</div>
      {t.bar!==undefined&&<div className="mt-2 h-2 overflow-hidden rounded-full bg-sunken" role="img" aria-label={`Ocupación ${t.bar} %`}><div className="h-full rounded-full bg-brand" style={{width:t.bar+'%'}}></div></div>}</div>)}</div>
    <TrendChart bookings={bookings}/>
    {alerts.length>0&&<div className="flex flex-col gap-2">{alerts.map((a,i)=><Notice key={i} tone={a.tone} onClick={()=>open(a.b.id)}
      icon={a.tone==='info'?<I.Plane size={18}/>:a.tone==='bad'?<I.Alert size={18}/>:<I.Clock size={18}/>} title={a.text}><span className="block truncate">{a.b.name} · {tripName(a.b)}</span></Notice>)}</div>}
    <div className="grid gap-5 lg:grid-cols-[1.4fr_1fr]">
      <div className="min-w-0 rounded-2xl border border-line bg-surface">
        <div className="flex items-center justify-between border-b border-line p-4"><h2 className="font-bold">Recogidas de hoy</h2><span className="text-[13px] text-muted">{dayLabel(TODAY)}</span></div>
        <ol className="divide-y divide-line">{today.map(b=>{const d=DRIVERS.find(x=>x.id===b.driverId);const isNext=nextB&&b.id===nextB.id;const past=b.status==='completada';return <li key={b.id} className={isNext?'bg-brandsoft':''}><button onClick={()=>open(b.id)} className={`flex w-full items-center gap-3 p-4 text-left ${isNext?'':'hover:bg-sunken'} ${past?'bg-sunken':''}`}>
          <span className="w-14 shrink-0"><span className="block text-[17px] font-extrabold tnum">{b.time}</span>{isNext&&<span className="block text-[12px] font-bold text-brandink">{untilLabel(b.time)}</span>}</span>
          <span className="min-w-0 flex-1">{isNext&&<span className="mb-0.5 block text-[12px] font-bold uppercase tracking-wider text-brandink">Siguiente recogida</span>}<span className="block truncate font-semibold">{tripName(b)}</span><span className="block truncate text-[13px] text-muted">{b.name} · {b.pax} pax · {b.dir==='in'?`sale a las ${toHM(spanOf(b,settings).a)} · `:''}libre a las {toHM(spanOf(b,settings).e)}</span></span>
          <Chip status={b.status}/></button></li>})}</ol>
      </div>
      <div className="min-w-0 rounded-2xl border border-line bg-surface">
        <div className="border-b border-line p-4"><h2 className="font-bold">Por confirmar</h2></div>
        {pending.length===0?<p className="p-4 text-muted">Todo confirmado. Las reservas nuevas aparecerán aquí.</p>:
        <ul className="divide-y divide-line">{pending.slice(0,6).map(b=><li key={b.id} className="flex flex-col gap-2 p-4">
          <button onClick={()=>open(b.id)} className="text-left"><span className="text-[13px] font-semibold text-muted">{dayLabel(b.date)} · {b.time} · {b.pax} pax</span><span className="block font-semibold">{tripName(b)}</span></button>
          <AssignBar b={b} assign={assign} bookings={bookings} settings={settings}/></li>)}</ul>}
      </div>
    </div>
  </div>;
}
function AssignBar({b,assign,bookings,settings}){
  const c=bookings&&settings?conflictsOf(b,bookings,settings):[];
  return <div className="flex flex-wrap items-center gap-2"><button onClick={()=>assign(b.id,'d1')} className="rounded-full bg-brandstrong px-4 py-1.5 text-[13px] font-semibold text-white">Confirmar</button>
    {c.length>0&&<span className="text-[13px] font-semibold text-bad">Se solapa con {c.map(x=>x.time).join(' y ')}</span>}</div>;
}

/* ---------- Reservas: lista + ficha ---------- */
function QuickAction({b,bookings,update,assign,small}){
  const cls=`shrink-0 rounded-full font-semibold whitespace-nowrap ${small?'px-3 py-1.5 text-[13px]':'h-9 px-3 text-[13px]'}`;
  const stop=fn=>e=>{e.stopPropagation();fn()};
  if(b.status==='nueva') return <button onClick={stop(()=>assign(b.id,'d1'))} className={`${cls} bg-brandstrong text-white`}>Confirmar</button>;

const BLOCK={nueva:'border-warn bg-warnsoft',asignada:'border-brand bg-brandsoft',en_camino:'border-info bg-infosoft',completada:'border-line bg-sunken',cancelada:'border-bad bg-badsoft'};

const mondayOf = iso => { const d=new Date(iso+'T12:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return isoDay(d); };
const shiftDay = (iso,n) => { const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return isoDay(d); };

function WeekView({items,open,settings,start,setStart,bookings,onSlot,pickDay,n=7}){

    </div>

      <div className={n===7?"min-w-[760px]":""}>

          <span></span>
          {days.map((d,i)=>{const n=items.filter(b=>b.date===d&&b.status!=='cancelada').length;const isT=d===TODAY;return <div key={d} role={pickDay?'button':undefined} tabIndex={pickDay?0:undefined} onClick={()=>pickDay&&pickDay(d)} onKeyDown={e=>{if(pickDay&&e.key==='Enter')pickDay(d)}} title={pickDay?'Ver el día':undefined} className={`px-2 py-2 text-center ${pickDay?'cursor-pointer hover:bg-sunken':''} ${isT?'text-brandink':''}`}>

            return <div key={d} onClick={e=>{if(!onSlot)return;const r=e.currentTarget.getBoundingClientRect();const m=Math.min(23*60+45,H0*60+Math.floor((e.clientY-r.top)/PX*4)*15);onSlot(d,toHM(m))}} title={onSlot?'Pulsa para apuntar una reserva a esta hora':undefined} className={`relative border-l border-line ${onSlot?'cursor-pointer hover:bg-[color-mix(in_srgb,var(--brand)_5%,transparent)]':''}`} style={d===TODAY?{background:'color-mix(in srgb, var(--brand) 6%, transparent)'}:undefined}>

        </div>

      {[['nueva','Por confirmar'],['asignada','Confirmada'],['en_camino','En camino'],['completada','Completada']].map(([k,l])=><span key={k} className="flex items-center gap-1.5"><span className={`h-3 w-3 rounded border ${BLOCK[k]}`}></span>{l}</span>)}

      <span className="ml-auto">El alto de cada bloque es el tiempo que el taxi está ocupado</span>
    </div>
  </div>;
}

function MonthView({items,month,setMonth,pickDay}){
  const [y,m]=month.split('-').map(Number);
  const first=new Date(y,m-1,1); const lead=(first.getDay()+6)%7; const dim=new Date(y,m,0).getDate();
  const cells=Array.from({length:Math.ceil((lead+dim)/7)*7},(_,i)=>{const dn=i-lead+1;return dn>=1&&dn<=dim?`${y}-${pad(m)}-${pad(dn)}`:null});
  const stats=d=>{const l=items.filter(b=>b.date===d&&b.status!=='cancelada');return {n:l.length,eur:l.reduce((s,b)=>s+b.total,0),pend:l.filter(b=>b.status==='nueva').length}};
  const all=cells.filter(Boolean).map(stats); const max=Math.max(1,...all.map(s=>s.n));

      </button>})}</div>

            <p className="mt-3 text-[13px] text-muted">Próximamente: asistente de WhatsApp que envía estos avisos solo.</p></>})()}
        </div>

        <details className="group rounded-2xl border border-line bg-surface p-4"><summary className="flex cursor-pointer list-none items-center justify-between gap-3 font-bold [&::-webkit-details-marker]:hidden">Nota interna del equipo<I.Chev className="shrink-0 text-muted transition group-open:rotate-90"/></summary><div className="mt-3">

        </div></details>

              <span className="w-24 shrink-0 text-muted tnum">{new Date(x.date+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'2-digit'})}</span>
              <span className="min-w-0 flex-1 truncate">{tripName(x)}</span><span className="font-semibold tnum">{eur(x.total)}</span></button></li>)}</ul>}
          </div></details>})()}

          <ol className="flex flex-col gap-2 text-[14px]">{[...b.log].reverse().map((l,i)=><li key={i} className="flex gap-3"><span className="w-12 shrink-0 text-muted tnum">{new Date(l.at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</span><span>{l.text}</span></li>)}</ol>
          <form className="mt-3 flex gap-2" onSubmit={e=>{e.preventDefault();if(note.trim()){update(b.id,{},'Nota: '+note.trim());setNote('')}}}>
            <input id="d-nota" aria-label="Nota interna" value={note} onChange={e=>setNote(e.target.value)} placeholder="Añadir un apunte al historial" className="h-11 min-w-0 flex-1 rounded-xl border border-line bg-surface px-3 outline-none focus:border-brand"/>
            <button className="h-11 rounded-xl bg-deep px-4 font-semibold text-white">Añadir</button></form>
        </div></details>
      </div>
      <div className="sticky bottom-0 z-10 mt-auto flex items-center gap-2 border-t border-line bg-surface p-3" style={{paddingBottom:'max(12px, env(safe-area-inset-bottom, 0px))'}}>

        <a href={`https://wa.me/${String(b.phone).replace(/\D/g,'')}`} target="_blank" rel="noopener" aria-label={`WhatsApp a ${b.name}`} className="grid h-12 w-12 shrink-0 place-items-center rounded-full border border-line hover:border-brand"><I.Msg/></a>
        {next?<button onClick={()=>update(b.id,{status:next[0],...(next[0]==='asignada'?{driverId:'d1'}:{})},next[0]==='asignada'?'Confirmada · email de confirmación enviado':next[1].replace('Marcar ','Marcada '))} className="h-12 flex-1 rounded-full bg-brandstrong font-bold text-white hover:opacity-90">{next[1]}</button>:<span className="flex-1 text-center text-[14px] text-muted">{b.status==='cancelada'?'Reserva cancelada':'Viaje completado'}</span>}
      </div>

  </div>;

/* Mantiene el foco del teclado dentro de un diálogo abierto (Tab / Mayús+Tab) */
function trapFocus(e){ if(e.key!=='Tab') return;
  const f=[...e.currentTarget.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]):not(.sr-only),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
  if(!f.length) return; const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()} else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()} }


const extraName=(id,s)=>(((s&&s.extras)||DEFAULT_EXTRAS).find(e=>e.id===id)||{name:id}).name;
/* ---------- Siguiente recogida (modo conductor): todo lo que necesita a un toque ---------- */
function NextCard({b,settings,onStatus,open}){
  const next={nueva:['asignada','Confirmar reserva'],asignada:['en_camino','Voy de camino'],en_camino:['completada','Completar viaje']}[b.status];
  const pickup=b.dir==='out'?`${b.ss}, Santa Susanna`:b.dest;
  const maps=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(pickup)}`;
  const sp=spanOf(b,settings); const bags=(b.luggage.s||0)+(b.luggage.m||0)+(b.luggage.l||0);
  const ex=Object.entries(b.extras||{}).filter(([,v])=>v);
  const wa=`https://wa.me/${String(b.phone).replace(/\D/g,'')}?text=${encodeURIComponent(`Hola ${b.name.split(' ')[0]}, tu taxi está en camino. Llega en unos minutos.`)}`;
  const big="flex h-14 flex-col items-center justify-center gap-0.5 rounded-xl border border-line bg-surface text-[13px] font-semibold hover:border-brand";
  return <section aria-labelledby="tss-next" className="rounded-2xl border-2 border-brand bg-surface p-4 sm:p-5">
    <div className="flex items-start justify-between gap-3">
      <div className="min-w-0">
        <h2 id="tss-next" className="text-[12px] font-bold uppercase tracking-wider text-brandink">Siguiente recogida · {untilLabel(b.time)}</h2>
        <div className="mt-1 text-[36px] font-extrabold leading-none tnum">{b.time}</div>
        {b.dir==='in'&&<p className="mt-1 text-[14px] font-semibold text-warn">Sal a las {toHM(sp.a)} para llegar a tiempo</p>}
      </div>
      <Chip status={b.status}/>
    </div>
    <p className="mt-3 text-[18px] font-bold leading-snug">{tripName(b)}</p>
    <p className="mt-1 text-[14px] text-muted">{b.name} · {b.pax} pax · {bags} maleta{bags===1?'':'s'}{b.flight?` · vuelo ${b.flight}`:''}</p>
    {(ex.length>0||b.notes)&&<div className="mt-3 flex flex-wrap gap-2">{ex.map(([k,v])=><span key={k} className="rounded-full bg-brandsoft px-2.5 py-1 text-[13px] font-semibold text-brandink">{v}× {extraName(k,settings)}</span>)}
      {b.notes&&<p className="w-full rounded-xl bg-goldsoft p-3 text-[14px] text-goldink"><b>Ojo:</b> {b.notes}</p>}</div>}
    <div className="mt-4 grid grid-cols-3 gap-2">
      <a href={maps} target="_blank" rel="noopener" className={big}><I.Route/>Navegar</a>
      <a href={`tel:${String(b.phone).replace(/[^\d+]/g,'')}`} className={big}><I.Phone/>Llamar</a>
      <a href={wa} target="_blank" rel="noopener" className={big}><I.Msg/>WhatsApp</a>
    </div>
    {next&&<button onClick={()=>onStatus(b,next[0])} className="mt-2 h-14 w-full rounded-xl bg-brandstrong text-[17px] font-bold text-white hover:opacity-90">{next[1]}</button>}
    <button onClick={()=>open(b.id)} className="mt-2 w-full py-2 text-center text-[14px] font-semibold text-brandink underline underline-offset-2">Ver la ficha completa</button>
  </section>;
}
function NoNextCard({up,open}){
  return <section className="rounded-2xl border border-dashed border-line bg-surface p-4 sm:p-5">

      :<p className="mt-1 text-[14px] text-muted">No hay reservas próximas. Las nuevas aparecerán aquí.</p>}

/* ---------- Agenda del coche ---------- */
function Agenda({bookings,open,assign,settings,onNew}){
  const small=(()=>{try{return window.matchMedia('(max-width: 767px)').matches}catch(e){return false}})();
  const [mode,setMode]=useState(()=>{let m=null;try{m=localStorage.getItem('tss-vista-agenda')}catch(e){};return m||(small?'dia':'semana')});
  const setModeP=m=>{setMode(m);try{localStorage.setItem('tss-vista-agenda',m)}catch(e){}};
  const [day,setDay]=useState(TODAY); const [wstart,setWstart]=useState(()=>small?TODAY:mondayOf(TODAY)); const [month,setMonth]=useState(TODAY.slice(0,7));
  const items=bookings.filter(b=>b.status!=='pago_pendiente');
  return <div className="flex flex-col gap-4">
    <div className="flex flex-wrap items-center justify-between gap-3">
      <div className="inline-flex rounded-full border border-line bg-surface p-1" role="tablist" aria-label="Vista del calendario">
        {[['dia','Día'],['semana',small?'3 días':'Semana'],['mes','Mes']].map(([k,l])=><button key={k} role="tab" aria-selected={mode===k} onClick={()=>setModeP(k)}
          className={`h-9 rounded-full px-4 text-[14px] font-semibold ${mode===k?'bg-deep text-white':'text-ink hover:bg-sunken'}`}>{l}</button>)}
      </div>
      {onNew&&mode!=='mes'&&<span className="flex items-center gap-1.5 text-[13px] text-muted"><I.Plus size={14}/>Pulsa en un hueco libre para apuntar una reserva</span>}
      {mode==='mes'&&<span className="text-[13px] text-muted">Pulsa un día para ver sus viajes</span>}
    </div>
    {mode==='dia'&&<DayView bookings={items} open={open} assign={assign} settings={settings} day={day} setDay={setDay} onNew={onNew}/>}
    {mode==='semana'&&<WeekView n={small?3:7} items={items} open={open} settings={settings} start={wstart} setStart={setWstart} bookings={items} onSlot={onNew} pickDay={d=>{setDay(d);setModeP('dia')}}/>}
    {mode==='mes'&&<MonthView items={items} month={month} setMonth={setMonth} pickDay={d=>{setDay(d);setModeP('dia')}}/>}
  </div>;
}

function DayView({bookings,open,assign,settings,day,setDay,onNew}){
  const list=bookings.filter(b=>b.date===day&&b.status!=='cancelada').sort((x,y)=>spanOf(x,settings).a-spanOf(y,settings).a);
  const startH=6,endH=24,pxMin=1.1;
  const rows=[]; let cursor=startH*60;
  list.forEach(b=>{const {a,e}=spanOf(b,settings); if(a-cursor>=30) rows.push({free:true,from:cursor,to:a}); rows.push({b,from:a,to:e,clash:conflictsOf(b,list,settings).length>0}); cursor=Math.max(cursor,e);});
  if(endH*60-cursor>=30) rows.push({free:true,from:cursor,to:endH*60});
  const busy=list.reduce((s,b)=>s+busyMin(b.dest,settings),0);
  const nowM=toMin(nowHM()); const past=day<TODAY;
  const slotStart=r=>{let m=Math.ceil(r.from/15)*15; if(day===TODAY) m=Math.max(m,Math.ceil((nowM+15)/15)*15); return m;};
  const full=new Date(day+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return <div className="flex flex-col gap-4">
    <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-line bg-surface p-3">
      <div className="flex items-center gap-2">
        <button onClick={()=>setDay(shiftDay(day,-1))} aria-label="Día anterior" className="grid h-9 w-9 place-items-center rounded-full border border-line hover:border-brand"><I.Back size={16}/></button>
        <button onClick={()=>setDay(TODAY)} className="h-9 rounded-full border border-line px-3 text-[14px] font-semibold hover:border-brand">Hoy</button>
        <button onClick={()=>setDay(shiftDay(day,1))} aria-label="Día siguiente" className="grid h-9 w-9 place-items-center rounded-full border border-line hover:border-brand"><I.Chev size={16}/></button>
        <span className="ml-1 font-bold first-letter:uppercase">{full}</span>
      </div>
      <input type="date" aria-label="Ir a un día" value={day} onChange={e=>e.target.value&&setDay(e.target.value)} className="h-9 rounded-full border border-line bg-surface px-3 text-[14px] font-semibold"/>
    </div>
    <div className="grid grid-cols-3 gap-3">
      {[['Viajes',list.length],['Horas ocupadas',`${hrs(busy)} h`],['Por confirmar',list.filter(b=>b.status==='nueva').length]].map(([k,v])=><div key={k} className="min-w-0 rounded-2xl border border-line bg-surface p-3 sm:p-4"><div className="text-[13px] font-semibold text-muted">{k}</div><div className="mt-1 text-[22px] font-extrabold tnum sm:text-[24px]">{v}</div></div>)}
    </div>
    <div className="rounded-2xl border border-line bg-surface p-4">
      <p className="mb-4 text-[13px] text-muted">Cada viaje ocupa el coche el tiempo de ida y vuelta. Los huecos libres son las horas que aún puedes vender.</p>
      <ol className="flex flex-col gap-2">{rows.map((r,i)=>{ if(r.free){ const canAdd=onNew&&!past&&!(day===TODAY&&r.to<=nowM+15);
          return <li key={'f'+i}>{canAdd?<button onClick={()=>onNew(day,toHM(slotStart(r)))} className="group flex w-full items-center gap-3 rounded-xl border border-dashed border-line px-3 py-2 text-left text-[14px] text-muted hover:border-brand hover:bg-brandsoft">
              <span className="w-28 shrink-0 tnum">{toHM(r.from)} – {r.to>=24*60?'24:00':toHM(r.to)}</span><span className="flex-1">Libre · {hrs(r.to-r.from)} h</span><span className="flex items-center gap-1 font-semibold text-brandink"><I.Plus size={16}/>Apuntar</span></button>
            :<div className="flex items-center gap-3 rounded-xl border border-dashed border-line px-3 py-2 text-[14px] text-muted"><span className="w-28 shrink-0 tnum">{toHM(r.from)} – {r.to>=24*60?'24:00':toHM(r.to)}</span><span>Libre · {hrs(r.to-r.from)} h</span></div>}</li>; }
        return <li key={r.b.id}><button onClick={()=>open(r.b.id)} className={`grid w-full grid-cols-[1fr_auto] items-center gap-x-3 gap-y-1 rounded-xl border px-3 py-3 text-left sm:grid-cols-[7rem_minmax(0,1fr)_auto] ${r.clash?'border-bad bg-badsoft':r.b.status==='nueva'?'border-warn bg-warnsoft':r.b.status==='completada'?'border-line bg-sunken':'border-brand bg-brandsoft'}`} style={{minHeight:Math.max(56,(r.to-r.from)*pxMin*0.5)}}>
          <span className="tnum"><span className="block font-bold">{toHM(r.from)} – {toHM(r.to)}</span><span className="block text-[12px] text-muted">{r.b.dir==='in'?`sale antes · recogida ${r.b.time}`:`recogida ${r.b.time}`}</span></span>
          <span className="col-span-2 row-start-2 min-w-0 sm:col-span-1 sm:row-start-auto"><span className="block font-semibold text-ink sm:truncate">{tripName(r.b)}</span><span className="block text-[13px] text-muted sm:truncate">{r.b.name} · {r.b.pax} pax · {eur(r.b.total)}{r.clash?' · se solapa con otro viaje':''}</span></span>
          <span className="col-start-2 row-start-1 justify-self-end sm:col-start-auto sm:row-start-auto"><Chip status={r.b.status}/></span></button>
          {r.b.status==='nueva'&&<div className="mt-1.5 pl-1"><AssignBar b={r.b} assign={assign} bookings={bookings} settings={settings}/></div>}</li>;})}</ol>
      {list.length===0&&<p className="mt-2 text-muted">No hay viajes este día: el taxi está libre.</p>}
    </div>
  </div>;
}

/* ---------- Clientes ---------- */
function Clients({bookings,open}){
  const [q,setQ]=useState('');
  const [only,setOnly]=useState('todos');
  const [sort,setSort]=useState({k:'last',dir:-1});
  const all=clientsOf(bookings);
  const val={name:c=>c.name.toLowerCase(),lang:c=>c.lang,count:c=>c.count,spent:c=>c.spent,last:c=>c.last,marketing:c=>c.marketing?1:0};
  const rows=all.filter(c=>only==='todos'||(only==='ofertas'?c.marketing:c.count>1))
    .filter(c=>!q||(c.name+c.phone+c.email).toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>{const x=val[sort.k](a),y=val[sort.k](b);return (x<y?-1:x>y?1:0)*sort.dir||b.count-a.count});
  const lastTxt=c=>{const d=new Date(c.last+'T12:00');return c.last>=addDays(-1)&&c.last<=addDays(1)?dayLabel(c.last):d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'2-digit'})};
  const Th=({k,children,right})=>{const on=sort.k===k;return <th className={`px-4 py-3 font-bold ${right?'text-right':''}`} aria-sort={on?(sort.dir>0?'ascending':'descending'):'none'}>
    <button onClick={()=>setSort(s=>({k,dir:s.k===k?-s.dir:(k==='name'||k==='lang'?1:-1)}))} className={`inline-flex min-h-[32px] items-center gap-1 uppercase tracking-wider hover:text-ink ${on?'text-ink':''}`}>
      {children}<span aria-hidden="true" className={on?'':'opacity-0'}>{sort.dir>0?'↑':'↓'}</span></button></th>};
  const latest=c=>c.list[c.list.length-1].id;
  return <div className="flex flex-col gap-4">
    <div className="flex flex-col gap-3 rounded-2xl border border-line bg-surface p-3 md:flex-row md:items-center">
      <div className="flex h-11 min-w-0 flex-1 items-center gap-2 rounded-xl border border-line px-3"><I.Search className="text-muted"/><input id="c-buscar" aria-label="Buscar clientes" value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por nombre, teléfono o email" className="h-full min-w-0 flex-1 bg-transparent outline-none placeholder:text-muted"/></div>
      <div className="flex flex-wrap gap-2">{[['todos',`Todos (${all.length})`],['habituales',`Repiten (${all.filter(c=>c.count>1).length})`],['ofertas',`Aceptan ofertas (${all.filter(c=>c.marketing).length})`]].map(([k,l])=>
        <button key={k} onClick={()=>setOnly(k)} className={`rounded-full px-3 py-1.5 text-[14px] font-semibold ${only===k?'bg-deep text-white':'bg-sunken'}`}>{l}</button>)}</div>
    </div>

    <ul className="divide-y divide-line overflow-hidden rounded-2xl border border-line bg-surface md:hidden">{rows.map(c=><li key={c.phone}>
      <button onClick={()=>open(latest(c))} className="flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-sunken">
        <span className="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-sunken text-[13px] font-bold">{c.lang}</span>
        <span className="min-w-0 flex-1"><span className="flex items-center gap-2"><span className="truncate font-semibold">{c.name}</span>{c.count>1&&<span className="shrink-0 rounded-full bg-goldsoft px-2 text-[11px] font-bold text-goldink">Habitual</span>}</span>
          <span className="block truncate text-[13px] text-muted tnum">{c.phone} · último {lastTxt(c).toLowerCase()}</span></span>
        <span className="shrink-0 text-right"><span className="block font-bold tnum">{eur(c.spent)}</span><span className="block text-[13px] text-muted tnum">{c.count} viaje{c.count>1?'s':''}</span></span>
      </button></li>)}
      {rows.length===0&&<li className="p-6 text-center text-muted">No hay clientes con estos filtros.</li>}</ul>

    <div className="hidden overflow-x-auto rounded-2xl border border-line bg-surface md:block">
      <table className="w-full min-w-[820px] text-left text-[14px]">
        <thead className="border-b border-line text-[12px] text-muted"><tr>
          <Th k="name">Cliente</Th><th className="px-4 py-3 font-bold uppercase tracking-wider">Contacto</th>
          <Th k="lang">Idioma</Th><Th k="count" right>Viajes</Th><Th k="spent" right>Gastado</Th><Th k="last">Último viaje</Th><Th k="marketing">Ofertas</Th>
        </tr></thead>
        <tbody className="divide-y divide-line">{rows.map(c=><tr key={c.phone} tabIndex={0} onClick={()=>open(latest(c))} onKeyDown={e=>{if(e.key==='Enter')open(latest(c))}} className="cursor-pointer hover:bg-sunken">
          <td className="px-4 py-3"><div className="flex items-center gap-2"><span className="font-semibold">{c.name}</span>{c.count>1&&<span className="rounded-full bg-goldsoft px-2 py-0.5 text-[12px] font-bold text-goldink">Habitual</span>}</div></td>
          <td className="px-4 py-3"><div className="whitespace-nowrap tnum">{c.phone}</div><div className="max-w-[220px] truncate text-[13px] text-muted">{c.email||'Sin email'}</div></td>
          <td className="px-4 py-3"><span className="rounded-full bg-sunken px-2 py-0.5 text-[12px] font-bold">{c.lang}</span></td>
          <td className="px-4 py-3 text-right font-semibold tnum">{c.count}</td>
          <td className="px-4 py-3 text-right font-semibold tnum">{eur(c.spent)}</td>
          <td className="px-4 py-3 whitespace-nowrap text-muted">{lastTxt(c)}</td>
          <td className="px-4 py-3"><span className={`inline-flex items-center gap-1.5 text-[13px] font-semibold ${c.marketing?'text-ok':'text-muted'}`}><span className={`h-2 w-2 rounded-full ${c.marketing?'bg-ok':'bg-line'}`}></span>{c.marketing?'Sí':'No'}</span></td>
        </tr>)}</tbody>
      </table>
      {rows.length===0&&<p className="p-6 text-center text-muted">No hay clientes con estos filtros.</p>}
    </div>
    <p className="text-[13px] text-muted">{rows.length} cliente{rows.length===1?'':'s'} · pulsa en uno para ver su última reserva y su historial.</p>
  </div>;
}

/* ---------- Campañas ---------- */
const LANG_NAME={ES:'Español',CA:'Català',EN:'English',DE:'Deutsch',FR:'Français',IT:'Italiano',PT:'Português'};
const SEGMENTS=[
  {id:'todos',name:'Todos los clientes',hint:'Todos los que han reservado alguna vez',test:()=>true},
  {id:'temporada',name:'Temporada pasada',hint:'Viajaron hace entre 10 y 14 meses y no han vuelto',test:c=>c.daysSince>=300&&c.daysSince<=430},
  {id:'repiten',name:'Clientes que repiten',hint:'Dos viajes o más',test:c=>c.count>=2},
  {id:'unviaje',name:'Solo un viaje',hint:'Para animarles a repetir',test:c=>c.count===1},
  {id:'aeropuerto',name:'Traslados al aeropuerto',hint:'Han ido o venido del aeropuerto',test:c=>c.airport},
  {id:'idioma',name:'Por idioma',hint:'Elige el idioma',test:(c,lang)=>c.lang===lang},
];
const TEMPLATES=[
  {id:'vuelve',name:'Vuelve este verano',subject:'¿Vuelves a Santa Susanna este verano?',body:'Hola {nombre}, el año pasado te llevamos en tu viaje y nos encantaría volver a hacerlo. Reserva tu traslado del aeropuerto con precio fijo en nuestra web.'},
  {id:'repite',name:'Gracias por repetir',subject:'Gracias por confiar otra vez en nosotros',body:'Hola {nombre}, gracias por viajar de nuevo con Taxi Santa Susanna. Para tu próximo traslado, reserva en nuestra web o escríbenos por WhatsApp.'},
  {id:'resena',name:'Pedir reseña',subject:'¿Qué tal tu viaje con nosotros?',body:'Hola {nombre}, gracias por viajar con Taxi Santa Susanna. Si te ha gustado, nos ayudas mucho dejando tu opinión en Google: solo es un minuto.'},
];
const AUTOS=[
  {id:'resena',name:'Pedir reseña en Google',when:'Al día siguiente de cada viaje completado',channel:'Email'},
];

function Campaigns({bookings,settings,setSettings,campaigns,setCampaigns,toast,onWhatsApp}){
  const clients=useMemo(()=>clientsOf(bookings),[bookings]);
  const [seg,setSeg]=useState('temporada'); const [lang,setLang]=useState('EN');
  const [channel,setChannel]=useState('email'); const [tpl,setTpl]=useState(TEMPLATES[0]);
  const [subject,setSubject]=useState(TEMPLATES[0].subject); const [body,setBody]=useState(TEMPLATES[0].body);
  const [confirm,setConfirm]=useState(false); const [showList,setShowList]=useState(false);
  const segDef=SEGMENTS.find(s=>s.id===seg);
  const inSeg=clients.filter(c=>segDef.test(c,lang));
  const consent=inSeg.filter(c=>c.marketing);
  const reachable=consent.filter(c=>channel==='email'?!!c.email:true);
  const noEmail=channel==='email'?consent.length-reachable.length:0;
  const cost=channel==='whatsapp'?reachable.length*0.05:0;
  const sample=reachable[0]||{name:'Laura Martín',lang:'ES'};
  const fill=s=>s.replace(/\{nombre\}/g,sample.name.split(' ')[0]);
  const auto=settings.automations||DEFAULT_AUTOMATIONS;
  const autoCount={
    resena:bookings.filter(b=>b.status==='completada'&&(b.date===TODAY||b.date===addDays(-1))).length,
    vuelve:clients.filter(c=>c.marketing&&c.email&&c.daysSince>=330&&c.daysSince<=360).length,
    repite:clients.filter(c=>c.marketing&&c.email&&c.count===2).length,
  };
  const withOk=clients.filter(c=>c.marketing).length;
  const kpis=[
    {k:'Clientes',v:clients.length,s:'con al menos una reserva'},
    {k:'Aceptan ofertas',v:withOk,s:`${Math.round(withOk/Math.max(1,clients.length)*100)} % del total`},
    {k:'Repiten',v:clients.filter(c=>c.count>1).length,s:'dos viajes o más'},
    {k:'Con email',v:clients.filter(c=>c.email).length,s:'para campañas por email'},
  ];
  const langs=Object.entries(clients.reduce((m,c)=>{m[c.lang]=(m[c.lang]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]);
  const pickTpl=t=>{setTpl(t);setSubject(t.subject);setBody(t.body)};
  function send(){
    const c={id:'c'+Date.now(),at:new Date().toISOString(),name:(channel==='email'?subject:tpl.name)||tpl.name,segment:segDef.id==='idioma'?`Idioma: ${LANG_NAME[lang]||lang}`:segDef.name,channel,sent:reachable.length,result:'Resultados en 48 h'};
    setCampaigns(cs=>[c,...cs]); setConfirm(false); toast(`Campaña enviada a ${reachable.length} personas (simulación)`);
  }
  return <div className="flex flex-col gap-5">
    <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">{kpis.map(t=><div key={t.k} className="min-w-0 rounded-2xl border border-line bg-surface p-4">
      <div className="text-[13px] font-semibold text-muted">{t.k}</div><div className="mt-1 text-[26px] font-extrabold tnum">{t.v}</div><div className="text-[13px] text-muted">{t.s}</div></div>)}</div>

    <Notice tone="info" icon={<I.Info size={18}/>} title="Solo reciben campañas quienes marcaron la casilla de ofertas al reservar (RGPD)">Los avisos del servicio, como la confirmación o el aviso de llegada, se envían siempre.</Notice>

    <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)]">
      <Section title="1. A quién" icon={I.Users}>
        <div className="flex flex-col gap-2" role="radiogroup" aria-label="Grupo de clientes">
          {SEGMENTS.map(s=>{const n=clients.filter(c=>s.test(c,lang));const ok=n.filter(c=>c.marketing).length;const on=seg===s.id;
            return <label key={s.id} htmlFor={'seg-'+s.id} className={`flex cursor-pointer items-center gap-3 rounded-xl border p-3 ${on?'border-brand bg-brandsoft':'border-line hover:border-brand'}`}>
              <input id={'seg-'+s.id} type="radio" name="segmento" className="h-4 w-4 accent-[var(--brand-strong)]" checked={on} onChange={()=>{setSeg(s.id);setConfirm(false)}}/>
              <span className="min-w-0 flex-1"><span className="block font-semibold">{s.name}</span><span className="block text-[13px] text-muted">{s.hint}</span>
                {s.id==='idioma'&&on&&<select id="seg-lang" aria-label="Idioma" value={lang} onChange={e=>setLang(e.target.value)} className="mt-2 h-9 rounded-full border border-line bg-surface px-3 text-[14px] font-semibold">
                  {langs.map(([k,n])=><option key={k} value={k}>{LANG_NAME[k]||k} ({n})</option>)}</select>}</span>
              <span className="shrink-0 text-right"><span className="block text-[18px] font-extrabold tnum">{ok}</span><span className="block text-[12px] text-muted tnum">de {n.length}</span></span>
            </label>})}
        </div>
        <p className="mt-3 text-[13px] text-muted">El número grande son los que aceptan ofertas; el pequeño, todos los del grupo.</p>
      </Section>

      <Section title="2. Qué les dices" icon={I.Mail}>
        <div className="grid gap-3">
          <div className="flex flex-wrap gap-2" role="group" aria-label="Canal">
            {[['email','Email',I.Mail]].map(([k,l,C])=><button key={k} type="button" aria-pressed={channel===k} onClick={()=>{setChannel(k);setConfirm(false)}}
              className={`flex h-10 items-center gap-2 rounded-full px-4 text-[14px] font-semibold ${channel===k?'bg-deep text-white':'border border-line bg-surface'}`}><C size={16}/>{l}</button>)}
            <button type="button" onClick={onWhatsApp} className="flex h-10 items-center gap-2 rounded-full border border-dashed border-line px-4 text-[13px] text-muted hover:border-brand"><I.Msg size={16}/>WhatsApp · próximamente</button>
          </div>
          <div className="flex flex-wrap items-center gap-2"><span className="text-[13px] font-semibold text-muted">Plantillas:</span>
            {TEMPLATES.map(t=><button key={t.id} type="button" onClick={()=>pickTpl(t)} className={`rounded-full border px-3 py-1.5 text-[13px] font-semibold ${tpl.id===t.id?'border-brand bg-brandsoft text-brandink':'border-line hover:border-brand'}`}>{t.name}</button>)}</div>
          {channel==='email'&&<Field label="Asunto" htmlFor="cp-asunto"><input id="cp-asunto" value={subject} onChange={e=>setSubject(e.target.value)} className={inputCls}/></Field>}
          <Field label="Mensaje" htmlFor="cp-texto" hint="{nombre} se cambia por el nombre de cada cliente"><textarea id="cp-texto" rows={5} value={body} onChange={e=>setBody(e.target.value)} className="w-full rounded-xl border border-line bg-surface p-3.5 text-[15px] outline-none focus:border-brand"/></Field>

          <div>
            <div className="mb-1.5 text-[13px] font-semibold uppercase tracking-wide text-muted">Vista previa · {sample.name}</div>
            {channel==='email'?<div className="overflow-hidden rounded-xl border border-line bg-surface">
              <div className="border-b border-line bg-sunken px-4 py-2.5 text-[13px]"><span className="text-muted">De:</span> Taxi Santa Susanna · <span className="text-muted">Asunto:</span> <b>{fill(subject)}</b></div>
              <div className="p-4 text-[14px] leading-relaxed">{fill(body)}<div className="mt-4"><span className="inline-block rounded-full bg-[#007A41] px-4 py-2 text-[14px] font-bold text-white">Reservar mi traslado</span></div>
                <p className="mt-4 text-[13px] text-muted">Recibes este email porque aceptaste recibir ofertas. <u>Darse de baja</u>.<br/>Taxi Santa Susanna · 08398 Santa Susanna (Barcelona)</p></div></div>
            :<div className="rounded-xl bg-[#EFE7DD] p-3 dark:bg-sunken"><div className="max-w-[92%] rounded-xl border-l-4 border-brand bg-white px-3 py-2 text-[14px] text-[#16221B] shadow-sm dark:bg-surface dark:text-ink">{fill(body)}
              <div className="mt-1 text-[13px] text-[#4B5A51] dark:text-muted">Responde BAJA para no recibir más ofertas.</div></div></div>}
            {sample.lang&&sample.lang!=='ES'&&<p className="mt-2 text-[13px] text-muted">En la versión real, cada cliente lo recibiría traducido a su idioma.</p>}
          </div>
        </div>
      </Section>
    </div>

    <div className="flex flex-col gap-3 rounded-2xl border-2 border-brand bg-surface p-4 sm:flex-row sm:items-center">
      <div className="min-w-0 flex-1">
        <div className="text-[13px] font-semibold uppercase tracking-wide text-muted">3. Enviar</div>
        <div className="text-[18px] font-extrabold"><span className="tnum">{reachable.length}</span> persona{reachable.length===1?'':'s'} recibirán este {channel==='email'?'email':'WhatsApp'}</div>
        <div className="text-[13px] text-muted">{inSeg.length-consent.length>0&&`${inSeg.length-consent.length} del grupo no aceptan ofertas y se quedan fuera. `}{noEmail>0&&`${noEmail} no tienen email. `}
          {channel==='whatsapp'?`Coste aproximado de Meta: ${new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(cost)}.`:'El email no tiene coste por envío.'}</div>
        <button type="button" onClick={()=>setShowList(v=>!v)} aria-expanded={showList} className="mt-1 inline-flex min-h-[44px] items-center text-[14px] font-semibold text-brandink underline underline-offset-2">{showList?'Ocultar destinatarios':'Ver destinatarios'}</button>
      </div>
      {!confirm?<button type="button" disabled={!reachable.length||!body.trim()} onClick={()=>setConfirm(true)} className="h-12 shrink-0 rounded-full bg-brandstrong px-6 font-bold text-white disabled:opacity-40">Enviar campaña</button>
        :<div className="flex shrink-0 flex-wrap items-center gap-2 rounded-xl bg-sunken p-2"><span className="px-1 text-[14px] font-semibold">¿Enviar a {reachable.length}?</span>
          <button type="button" onClick={send} className="h-10 rounded-full bg-brandstrong px-4 font-bold text-white">Sí, enviar</button><button type="button" onClick={()=>setConfirm(false)} className="h-10 rounded-full px-3 font-semibold">No</button></div>}
    </div>
    {showList&&<div className="overflow-hidden rounded-2xl border border-line bg-surface"><ul className="max-h-72 divide-y divide-line overflow-auto">{reachable.map(c=>
      <li key={c.phone} className="flex flex-wrap items-center gap-x-4 gap-y-0.5 px-4 py-2.5 text-[14px]"><span className="min-w-0 flex-1 font-semibold">{c.name}</span><span className="text-muted">{channel==='email'?c.email:c.phone}</span><span className="text-muted">{c.lang} · {c.count} viaje{c.count>1?'s':''}</span></li>)}
      {reachable.length===0&&<li className="p-4 text-center text-muted">Nadie en este grupo acepta ofertas{channel==='email'?' y tiene email':''}.</li>}</ul></div>}

    <div className="grid gap-5 xl:grid-cols-2">
      <Section title="Mensajes automáticos" icon={I.Timer}>
        <div className="flex flex-col divide-y divide-line">{AUTOS.map(a=><label key={a.id} htmlFor={'auto-'+a.id} className="flex cursor-pointer items-center gap-3 py-3">
          <span className="min-w-0 flex-1"><span className="block font-semibold">{a.name}</span><span className="block text-[13px] text-muted">{a.when} · {a.channel}{a.service?' · a todos los clientes':' · solo con permiso'}</span>
            {auto[a.id]&&<span className="mt-0.5 block text-[13px] font-semibold text-brandink tnum">{autoCount[a.id]} programado{autoCount[a.id]===1?'':'s'} ahora mismo</span>}</span>
          <input id={'auto-'+a.id} type="checkbox" className="peer sr-only" checked={!!auto[a.id]} onChange={e=>setSettings(s=>({...s,automations:{...(s.automations||DEFAULT_AUTOMATIONS),[a.id]:e.target.checked}}))}/>
          <span className="relative h-7 w-12 shrink-0 rounded-full bg-line transition peer-checked:bg-brandstrong after:absolute after:left-1 after:top-1 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition peer-checked:after:translate-x-5 peer-focus-visible:ring-2 peer-focus-visible:ring-brand peer-focus-visible:ring-offset-2" aria-hidden="true"></span>
        </label>)}</div>
      </Section>
      <Section title="Campañas enviadas" icon={I.List}>
        {campaigns.length===0?<p className="text-muted">Todavía no has enviado ninguna campaña.</p>:
        <ul className="flex flex-col divide-y divide-line">{campaigns.map(c=><li key={c.id} className="flex items-start gap-3 py-3">
          <span className="mt-0.5 text-brandink">{c.channel==='email'?<I.Mail/>:<I.Msg/>}</span>
          <span className="min-w-0 flex-1"><span className="block font-semibold">{c.name}</span>
            <span className="block text-[13px] text-muted">{new Date(c.at).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})} · {c.segment} · <span className="tnum">{c.sent}</span> enviados</span></span>
          <span className="shrink-0 text-right text-[13px]"><span className="block font-semibold">{c.result}</span>{c.example&&<span className="block text-muted">ejemplo</span>}</span></li>)}</ul>}
      </Section>
    </div>
  </div>;
}

/* ---------- Asistente de WhatsApp (ampliación futura: vista previa) ---------- */
function WhatsAppView({settings}){
  const t=settings.tarifas.find(x=>x.name==='Aeropuerto Barcelona-El Prat')||settings.tarifas[0];
  const chat=[
    {me:false,t:'08:12',x:"Hi! How much is a taxi from Hotel Riviera to Barcelona airport tomorrow at 6:00? We are 3 people with 3 suitcases."},
    {me:true,t:'08:12',x:`Hi! 😊 From Hotel Riviera to Barcelona Airport tomorrow at 06:00 it is a fixed price of ${eur(t.night)} (night rate), for up to 4 people with luggage. Shall I book it for you?`},

function App(){

  const [settings,setSettings]=useState(()=>saved&&saved.settings||DEFAULT_SETTINGS);

  const [view,setView]=useState(NAV.some(n=>n[0]===h0)?h0:'hoy'); const [sel,setSel]=useState(null); const [toast,setToast]=useState('');
  const [campaigns,setCampaigns]=useState(()=>saved&&saved.campaigns||SEED_CAMPAIGNS()); const [prefill,setPrefill]=useState(null);

  useEffect(()=>{store.set('tss-central-v7',{bookings,settings,campaigns})},[bookings,settings,campaigns]);
  // Sincroniza con otras ventanas abiertas (p. ej. el móvil y el panel de la presentación)
  useEffect(()=>{const h=e=>{if(e.key!=='tss-central-v7'||!e.newValue)return;let d;try{d=JSON.parse(e.newValue)}catch(_){return}
    if(d.bookings){seq=Math.max(seq,...d.bookings.map(b=>+String(b.id).slice(3)||0))+1;
      setBookings(prev=>{const nb=d.bookings.filter(b=>!prev.some(p=>p.id===b.id));if(nb.length)setTimeout(()=>setToast(`Nueva reserva de ${nb[nb.length-1].name}`),0);return d.bookings})}
    if(d.settings)setSettings(d.settings); if(d.campaigns)setCampaigns(d.campaigns)};
    addEventListener('storage',h);return()=>removeEventListener('storage',h)},[]);
  // Si el panel se queda abierto pasada la medianoche, recarga para que «Hoy» sea el día nuevo (los datos se mantienen)
  useEffect(()=>{const t=setInterval(()=>{if(isoDay(new Date())!==TODAY)location.reload()},60000);return()=>clearInterval(t)},[]);

  const update=(id,patch,logText)=>{const now=new Date().toISOString();
